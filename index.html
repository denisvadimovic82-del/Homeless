<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>БОМЖ</title>
<style>
  :root { --bg:#0a0a0f; --panel:rgba(15,18,25,0.95); --border:#4a5a7a; --accent:#e8b860; --text:#d0d5e0; --text-dim:#7a859a; --slot-bg:#1a1e28; --slot-border:#3a4a5a; --ui-scale:1;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px); --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden; user-select:none; }
  #game { position:absolute; inset:0; z-index:1; }
  #game canvas { display:block; width:100%!important; height:100%!important; }
  #hud { position:absolute; top:calc(var(--safe-top) + 10px); left:calc(var(--safe-left) + 10px); display:flex; flex-direction:column; z-index:10; pointer-events:none; }
  .stat-box { background:var(--panel); border:2px solid var(--border); border-bottom:none; padding:4px 8px; font-size:calc(12px * var(--ui-scale)); font-weight:bold; display:flex; align-items:center; gap:8px; }
  .stat-box:last-child { border-bottom:2px solid var(--border); border-radius:0 0 6px 6px; }
  .stat-box:first-child { border-radius:6px 6px 0 0; }
  .bar-bg { width:70px; height:8px; background:#111; border:1px solid #000; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; transition:width 0.2s; }
  .hp { background:#d34b4b; } .hunger { background:#d39b4b; } .water { background:#4b9bd3; }
  #clock { position:absolute; top:calc(var(--safe-top) + 10px); right:calc(var(--safe-right) + 10px); background:var(--panel); border:2px solid var(--border); border-radius:20px; padding:6px 12px; font-size:calc(12px * var(--ui-scale)); font-weight:bold; color:var(--accent); z-index:10; pointer-events:none; text-align:center; display:flex; flex-direction:column; gap:2px; line-height:1.2; }
  #dayText { font-size:calc(10px * var(--ui-scale)); color:#aaa; font-weight:normal; }
  #weatherText { font-size:calc(11px * var(--ui-scale)); color:#fff; }
  #questBox { position:absolute; top:calc(var(--safe-top) + 100px); left:50%; transform:translateX(-50%); background:rgba(40,30,20,0.9); border:2px solid var(--accent); border-radius:8px; padding:6px 12px; font-size:calc(11px * var(--ui-scale)); color:#ffe8b0; font-weight:bold; z-index:10; pointer-events:none; display:none; text-align:center; max-width:90%; }
  
  #log { position:absolute; bottom:calc(var(--safe-bottom) + 250px); left:0; width:100%; height:120px; background:rgba(10,12,18,0.85); border-top:2px solid var(--border); border-bottom:2px solid var(--border); padding:4px 10px; overflow-y:auto; font-size:calc(11px * var(--ui-scale)); z-index:10; pointer-events:none; color:#fff; text-shadow:1px 1px 0 #000; }
  #log::-webkit-scrollbar { display:none; }

  .tbtn, .close-btn, .craft-tab, .recipe-btn, .shop-row button, #actionMenu button,
  #jailOverlay button, .modal-box button, #deathScreen button {
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s, border-color 0.12s;
  }
  .tbtn:active, .close-btn:active, .craft-tab:active, .recipe-btn:active,
  .shop-row button:active, #actionMenu button:active, #jailOverlay button:active,
  .modal-box button:active, #deathScreen button:active {
    transform: scale(0.93);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  .close-btn:active { transform: scale(0.97); }
  .tbtn:active { background:rgba(232,184,96,0.25); border-color:var(--accent); color:var(--accent); }

  /* ===== СЕТКА КНОПОК ===== */
  /* Шаг по X: 67px (56 + 11px зазор). Шаг по Y: 75px (56 + 19px зазор) */
  .tbtn { position:absolute; width:calc(56px * var(--ui-scale)); height:calc(56px * var(--ui-scale)); background:var(--panel); border:2px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:calc(20px * var(--ui-scale)); color:#ccc; z-index:20; }
  
  /* ЛЕВАЯ ПАНЕЛЬ: вертикальный столбец 🏆 / ⤒ / ◀ и ▶ справа от ◀ */
  #btnRecord { left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 164px); background:#2a3a4a; border-color:#4a5a8a; }
  #btnJump   { left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 89px); }
  #btnLeft   { left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnRight  { left:calc(var(--safe-left) + 81px); bottom:calc(var(--safe-bottom) + 14px); }

  /* ПРАВАЯ СТОРОНА (ДЕЙСТВИЯ) */
  /* 1-й ряд (снизу) */
  #btnPick   { right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnCraft  { right:calc(var(--safe-right) + 81px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnThrow  { right:calc(var(--safe-right) + 148px); bottom:calc(var(--safe-bottom) + 14px); background:#3a2a1a; border-color:#8a5a2a; display:none; }

  /* 2-й ряд (середина) */
  #btnAttack { right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 89px); }
  #btnInv    { right:calc(var(--safe-right) + 81px); bottom:calc(var(--safe-bottom) + 89px); }
  #btnDog    { right:calc(var(--safe-right) + 148px); bottom:calc(var(--safe-bottom) + 89px); background:#3a2a1a; border-color:#c8a050; display:none; }
  #btnDog.feed { border-color:#6c6; box-shadow:0 0 10px rgba(108,204,108,0.5); }
  #btnDog:disabled { opacity:0.4; filter:grayscale(0.7); }

  /* 3-й ряд (сверху) */
  #btnSit    { right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 164px); background:#4a3a2a; border-color:#8a6a4a; }
  #ctxBtn    { right:calc(var(--safe-right) + 81px); bottom:calc(var(--safe-bottom) + 164px); background:#2a4a2a; border-color:#4a8a4a; display:none; }
  #ctxBtnHide{ right:calc(var(--safe-right) + 148px); bottom:calc(var(--safe-bottom) + 164px); background:#2a2a4a; border-color:#4a4a8a; display:none; }

  #deathScreen { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; flex-direction:column; color:#d34b4b; font-family:monospace; text-align:center; padding:20px; }
  #deathScreen h1 { font-size:40px; margin-bottom:20px; text-shadow:0 0 20px #d34b4b; }
  #deathScreen button { background:#333; color:#fff; border:2px solid #666; padding:15px 30px; font-size:18px; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:20px; }
  #hideOverlay { position:fixed; inset:0; background:#000; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:monospace; font-size:20px; text-align:center; padding:20px; }

  #jailOverlay { position:fixed; inset:0; background:#1a1a1a; z-index:9998; display:none; flex-direction:column; align-items:center; justify-content:center; color:#d0d5e0; font-family:monospace; text-align:center; padding:20px; }
  #jailOverlay h1 { font-size:40px; color:#4a5a7a; margin-bottom:10px; }
  #jailOverlay .jail-time { font-size:30px; color:#e8b860; margin-bottom:10px; font-weight:bold; }
  #jailOverlay .jail-sub { color:#7a859a; font-size:14px; margin-bottom:20px; max-width:400px; }
  #jailOverlay button { background:#3a1a1a; color:#fff; border:2px solid #6a2a2a; padding:12px 24px; font-size:15px; border-radius:8px; cursor:pointer; font-weight:bold; margin:6px; }
  #jailOverlay button.buy { background:#1a3a1a; border-color:#2a6a2a; }
  #jailOverlay button:disabled { opacity:0.4; cursor:not-allowed; filter:grayscale(1); }

  .modal { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .modal-box { background:var(--panel); border:2px solid var(--border); border-radius:10px; width:95%; max-width:420px; padding:16px; display:flex; flex-direction:column; max-height:85vh; overflow:hidden; }
  .modal-box h3 { margin:0 0 12px; color:var(--accent); text-align:center; font-size:18px; text-transform:uppercase; flex-shrink:0; }
  #invPanel, #stashPanel { align-items: center; justify-content: center; padding: 10px; }
  .modal-box.inv-box { width: 100%; max-width: 380px; height: auto; max-height: 90vh; border-radius: 16px; border: 2px solid var(--border); background: #12151e; box-shadow: 0 10px 40px rgba(0,0,0,0.8); padding: 16px; display: flex; flex-direction: column; }
  .inv-layout { display: flex; gap: 10px; min-height: 0; margin-bottom: 12px; }
  .eq-pane { display: flex; flex-direction: column; gap: 6px; background: #0a0c10; padding: 6px; border-radius: 10px; border: 1px solid var(--slot-border); width: 58px; flex-shrink: 0; overflow-y: auto; align-items: center; }
  .eq-slot { width: 44px; height: 44px; background: var(--slot-bg); border: 2px solid var(--slot-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; position: relative; flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s, transform 0.08s; }
  .eq-slot:active { transform: scale(0.9); }
  .eq-slot.active { border-color: var(--accent); box-shadow: inset 0 0 12px rgba(232,184,96,0.3); background: linear-gradient(145deg, #1a1e28, #2a2e38); }
  .eq-slot .ghost { opacity: 0.15; position: absolute; pointer-events: none; }
  .eq-slot .real { position: relative; z-index: 1; text-shadow: 0 2px 4px #000; }

  .grid-wrapper { flex: 1; min-width: 0; height: 306px; max-height: 306px; background: #0a0c10; border-radius: 10px; border: 1px solid var(--slot-border); padding: 6px; overflow-y: scroll; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--border) transparent; touch-action: pan-y; overscroll-behavior: contain; }
  .grid-wrapper * { touch-action: pan-y; }
  .grid-wrapper::-webkit-scrollbar { width: 6px; }
  .grid-wrapper::-webkit-scrollbar-track { background: transparent; }
  .grid-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #invGrid, #stashGrid { display: grid; grid-template-columns: repeat(4, 54px); grid-auto-rows: 54px; gap: 6px; width: max-content; margin: 0 auto; }
  .slot { width: 54px; height: 54px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; position: relative; user-select: none; transition: transform 0.08s, border-color 0.2s; }
  .slot:active { transform: scale(0.92); }
  .slot.empty { opacity: 0.3; background: #111; border-style: dashed; }
  .slot .count { position: absolute; bottom: 2px; right: 4px; font-size: 12px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000; }
  .slot.weapon-type { border-color:#5588cc; background:linear-gradient(145deg,#1a1e28,#1a2233); }
  .slot.armor-type { border-color:#cc8855; background:linear-gradient(145deg,#1a1e28,#2a1e18); }
  .slot.mat-type { border-color:#558855; background:linear-gradient(145deg,#1a1e28,#182418); }
  .slot.unique-type { border-color:#c060c0; background:linear-gradient(145deg,#1a1e28,#301830); box-shadow:inset 0 0 12px #602060; }

  .craft-tabs { display:flex; gap:4px; margin-bottom:12px; overflow-x:auto; }
  .craft-tab { background:#1a1e28; border:1px solid var(--slot-border); border-radius:4px; padding:6px 12px; color:var(--text-dim); font-size:12px; font-weight:bold; cursor:pointer; }
  .craft-tab.active { background:#2a3a5a; color:var(--accent); border-color:var(--accent); }
  #craftList { max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .recipe-btn { background:#141820; color:var(--text); border:1px solid var(--slot-border); border-radius:6px; padding:10px; display:flex; justify-content:space-between; align-items:center; font-size:12px; cursor:pointer; }
  .recipe-btn:disabled { opacity:0.3; }
  .recipe-btn .title { font-weight:bold; font-size:13px; color:#fff; }
  .recipe-btn .cost { color:var(--text-dim); font-size:11px; margin-top:4px; }
  .shop-row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding:8px 0; font-size:13px; }
  .shop-row button { padding:6px 12px; background:#4a3a2a; border:1px solid var(--accent); color:#fff; border-radius:4px; cursor:pointer; font-weight:bold; }
  .shop-row button:disabled { opacity:0.4; }
  .record-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333; font-size:14px; }
  .record-val { color:var(--accent); font-weight:bold; }
  .close-btn { margin-top:12px; background:#3a1a1a; border:2px solid #6a2a2a; color:#fff; width:100%; padding:12px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; flex-shrink: 0; }

  #actionMenu { position:fixed; z-index:12000; display:none; background:rgba(15,18,25,0.98); border:2px solid var(--accent); border-radius:8px; padding:6px; flex-direction:column; gap:4px; box-shadow:0 10px 30px rgba(0,0,0,0.9); }
  #actionMenu button { background:#2a2a4a; border:1px solid #4a4a8a; color:#fff; padding:8px 16px; border-radius:4px; font-size:13px; font-weight:bold; cursor:pointer; min-width:140px; }
  #actionMenu button:hover { background:#3a3a6a; }
  #actionMenu button.danger { background:#4a1a1a; border-color:#8a2a2a; }

  #tooltip { position:fixed; z-index:11000; display:none; background:rgba(10,12,18,0.98); border:2px solid #4a5a7a; border-radius:8px; padding:10px; max-width:220px; min-width:160px; box-shadow:0 10px 30px rgba(0,0,0,0.9); font-family:monospace; color:#d0d5e0; font-size:12px; pointer-events:none; transform:translate(-50%,-100%); margin-top:-10px; }
  #ttTitle { font-size:13px; font-weight:bold; color:#e8b860; margin-bottom:3px; }
  #ttDesc { color:#8a95aa; font-style:italic; margin-bottom:6px; font-size:11px; line-height:1.2; }
  #ttStats { display:flex; flex-direction:column; gap:2px; font-size:11px; }
  .tt-row { display:flex; justify-content:space-between; gap:8px; }
  .tt-row span:first-child { color:#7a859a; }
  .tt-row span:last-child { color:#e8b860; font-weight:bold; }
  .tt-diff { margin-top:6px; padding-top:6px; border-top:1px solid #333; font-size:11px; }
  .tt-up { color:#6c6; } .tt-down { color:#c66; } .tt-same { color:#aaa; }
  #eventBanner { position:fixed; top:calc(var(--safe-top) + 120px); left:50%; transform:translateX(-50%); background:rgba(20,30,50,0.95); border:2px solid var(--accent); border-radius:8px; padding:12px 20px; color:#fff; font-weight:bold; font-size:14px; z-index:9000; display:none; text-align:center; max-width:90%; }
  #dogIndicator { position:fixed; top:calc(var(--safe-top) + 10px); left:calc(var(--safe-left) + 170px); background:linear-gradient(145deg, #8a5a2a, #5a3a1a); border:2px solid #e8b860; border-radius:50%; width:calc(40px * var(--ui-scale)); height:calc(40px * var(--ui-scale)); display:none; align-items:center; justify-content:center; font-size:calc(22px * var(--ui-scale)); z-index:20; box-shadow:0 0 10px rgba(232,184,96,0.5), inset 0 0 6px rgba(0,0,0,0.4); }
</style>
</head>
<body>
<div id="game"></div>
<div id="eventBanner"></div>
<div id="questBox"></div>
<div id="hideOverlay"><h2 id="hideText">Ты прячешься...</h2><p id="hideSub" style="color:#aaa;font-size:14px;margin-top:10px;">Засыпаешь до утра!</p></div>
<div id="jailOverlay">
  <h1>🚔 ТЮРЬМА</h1>
  <div class="jail-time" id="jailTimer">0:00</div>
  <div class="jail-sub" id="jailSubText">Ты попал за решётку. Сиди смирно...</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
    <button class="buy" id="jailPayBtn">💰 Заплатить 200 монет</button>
    <button id="jailEscapeBtn">🏃 Сбежать (21%)</button>
  </div>
</div>
<div id="deathScreen">
  <h1>ТЫ УМЕР</h1>
  <p id="deathReason" style="color:#aaa;margin-bottom:20px;"></p>
  <button onclick="respawn()">ВСТАТЬ СНОВА</button>
</div>
<div id="clock"><div>🕒 <span id="timeText">12:00</span></div><div id="dayText">Пт, 1 Янв, 2027</div><div id="weatherText">☀️ Ясно</div></div>
<div id="hud">
  <div class="stat-box">❤️ <div class="bar-bg"><div id="hpbar" class="bar-fill hp" style="width:100%"></div></div></div>
  <div class="stat-box">🍖 <div class="bar-bg"><div id="hungerbar" class="bar-fill hunger" style="width:100%"></div></div></div>
  <div class="stat-box">💧 <div class="bar-bg"><div id="waterbar" class="bar-fill water" style="width:100%"></div></div></div>
  <div class="stat-box">⭐ <span id="reputationText" style="color:#c8c8ff">0</span></div>
</div>
<div id="dogIndicator">🐕</div>
<div id="log"></div>
<div id="btnLeft" class="tbtn">◀</div><div id="btnRight" class="tbtn">▶</div><div id="btnJump" class="tbtn">⤒</div>
<div id="btnAttack" class="tbtn">⚔</div><div id="btnPick" class="tbtn">✋</div><div id="btnCraft" class="tbtn">🔨</div>
<div id="btnInv" class="tbtn">🎒</div><div id="btnThrow" class="tbtn">🍾</div><div id="btnSit" class="tbtn">🪑</div>
<div id="btnRecord" class="tbtn">🏆</div><div id="ctxBtn" class="tbtn">🔍</div><div id="ctxBtnHide" class="tbtn">🛌</div>
<div id="btnDog" class="tbtn">🐕</div>
<div id="tooltip"><div id="ttTitle"></div><div id="ttDesc"></div><div id="ttStats"></div></div>
<div id="actionMenu"></div>

<div id="invPanel" class="modal"><div class="modal-box inv-box">
  <h3>🎒 Инвентарь</h3>
  <div class="inv-layout">
    <div class="eq-pane">
      <div class="eq-slot" data-slot="head"><span class="ghost">👒</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="body"><span class="ghost">🧥</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="hands"><span class="ghost">🧤</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="legs"><span class="ghost">👖</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="feet"><span class="ghost">👢</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="weapon" style="border-color:#5588cc;"><span class="ghost">⚔</span><span class="real"></span></div>
    </div>
    <div class="grid-wrapper"><div id="invGrid"></div></div>
  </div>
  <button class="close-btn" id="closeInv">ЗАКРЫТЬ</button>
</div></div>

<div id="craftPanel" class="modal"><div class="modal-box">
  <h3>🔨 Верстак</h3><div class="craft-tabs" id="craftTabs"></div><div id="craftList"></div>
  <button class="close-btn" id="closeCraft">ЗАКРЫТЬ</button>
</div></div>
<div id="shopPanel" class="modal"><div class="modal-box">
  <h3 id="shopTitle">🏪</h3><div id="shopItems" style="overflow-y:auto;max-height:50vh;"></div>
  <button class="close-btn" onclick="document.getElementById('shopPanel').classList.remove('open')">ЗАКРЫТЬ</button>
</div></div>

<div id="recordPanel" class="modal"><div class="modal-box">
  <h3>🏆 Рекорды</h3>
  <div style="display:flex; gap:4px; margin-bottom:12px;">
    <button class="craft-tab active" id="recTabScores" onclick="switchRecTab('scores')">Рекорды</button>
    <button class="craft-tab" id="recTabAchieves" onclick="switchRecTab('achieves')">Достижения</button>
  </div>
  <div id="recScoresView">
    <div class="record-row"><span>Дней:</span> <span class="record-val" id="recDays">0</span></div>
    <div class="record-row"><span>Монет:</span> <span class="record-val" id="recCoins">0</span></div>
    <div class="record-row"><span>Гопников:</span> <span class="record-val" id="recKills">0</span></div>
    <div class="record-row"><span>Боссов:</span> <span class="record-val" id="recBosses">0</span></div>
    <div class="record-row"><span>Бизнес:</span> <span class="record-val" id="recBiz">0</span></div>
  </div>
  <div id="recAchievesView" style="display:none; max-height:50vh; overflow-y:auto;">
    <div id="achieveList"></div>
  </div>
  <button class="close-btn" onclick="document.getElementById('recordPanel').classList.remove('open')">ЗАКРЫТЬ</button>
</div></div>

<div id="stashPanel" class="modal"><div class="modal-box inv-box">
  <h3>🏚️ Тайник</h3>
  <div style="display:flex;gap:8px;margin-bottom:8px;flex-shrink:0;">
    <button class="close-btn" style="margin:0;flex:1;padding:8px;" onclick="stashAll()">⬅️ Положить</button>

const AudioSys = {
  ctx:null, init(){ if(this.ctx) return; this.ctx=new (window.AudioContext||window.webkitAudioContext)(); },
  play(t){ if(!this.ctx) return; const time=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();
    if(t==='punch'){osc.type='sine';osc.frequency.setValueAtTime(100,time);osc.frequency.exponentialRampToValueAtTime(20,time+0.1);gain.gain.setValueAtTime(0.4,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.1);}

    else if(t==='glass'){osc.type='triangle';osc.frequency.setValueAtTime(1500,time);osc.frequency.exponentialRampToValueAtTime(500,time+0.15);gain.gain.setValueAtTime(0.2,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.15);}
    else if(t==='pickup'){osc.type='sine';osc.frequency.setValueAtTime(600,time);osc.frequency.setValueAtTime(800,time+0.1);gain.gain.setValueAtTime(0.15,time);gain.gain.linearRampToValueAtTime(0,time+0.15);}

    else if(t==='event'){osc.type='square';osc.frequency.setValueAtTime(400,time);osc.frequency.setValueAtTime(600,time+0.1);osc.frequency.setValueAtTime(800,time+0.2);gain.gain.setValueAtTime(0.2,time);gain.gain.linearRampToValueAtTime(0,time+0.3);}

function syncInv(){
  state.inv = {};
  for(const s of state.slots){ if(s){ state.inv[s.id] = (state.inv[s.id]||0) + s.count; } }
  if(state.inv.food > 0 && !state.foodAgeStart) state.foodAgeStart = {day:worldDay, time:worldTime};
  if(!state.inv.food) state.foodAgeStart = null;
}
function invCount(id){ return state.inv[id]||0; }
function addToSlots(slots, id, n=1){
  const item = ITEMS[id]; if(!item) return 0;
  let left = n;
  if(STACKABLE.has(id)){
    for(const s of slots){ if(s && s.id===id && left>0){ s.count += left; left = 0; } }
  }
  if(left>0){
    for(let i=0;i<slots.length && left>0;i++){
      if(!slots[i]){ slots[i] = {id, count: left}; left = 0; }
    }
  }
  return n - left;
}
function invAdd(id, n=1){
  const added = addToSlots(state.slots, id, n);
  syncInv(); renderUI();
  if(added>0) AudioSys.play(id==='coin'?'coin':'pickup');
  if(added < n){ AudioSys.play('error'); log('❌ Инвентарь заполнен'); showEventBanner('❌ Инвентарь заполнен!'); }
  return added;
}
function invRemove(id, n=1){
  if(invCount(id) < n) return false;
  let left = n;
  for(let i=0;i<state.slots.length && left>0;i++){
    const s = state.slots[i];
    if(s && s.id===id){
      const take = Math.min(s.count, left);
      s.count -= take; left -= take;
      if(s.count<=0) state.slots[i] = null;
    }
  }
  syncInv(); renderUI(); return true;
}

function loadGame() {
  try {

    Object.assign(state, { hp: data.hp ?? 100, hunger: data.hunger ?? 100, water: data.water ?? 100, equip: data.equip || state.equip });
    if (Array.isArray(data.slots) && data.slots.length===INV_SIZE) state.slots = data.slots.filter(s => !s || ITEMS[s.id]);
    if (Array.isArray(data.stashSlots) && data.stashSlots.length===INV_SIZE) state.stashSlots = data.stashSlots.filter(s => !s || ITEMS[s.id]);

    state.lastSaveTime = data.lastSaveTime || 0;
    window.__savedX = data.x || 0;
    if (businessLevel > 0 && state.lastSaveTime) {
      const elapsed = Math.min(8 * 3600 * 1000, Date.now() - state.lastSaveTime);

}

  document.getElementById('jailPayBtn').style.display = '';

function updateJailUI(){

  }

function updateJail(delta){
  if (!inJail) return;
  state.jailTime -= delta/1000;
  if (state.jailTime <= 0) { releaseFromJail('served'); return; }
  const m = Math.floor(state.jailTime / 60);
  const s = Math.floor(state.jailTime % 60);
  document.getElementById('jailTimer').textContent = `${m}:${String(s).padStart(2,'0')}`;
}
function releaseFromJail(reason){
  inJail = false;
  state.jailTime = 0;
  let bonus = 0;
  if (reason === 'served') bonus = 50;
  else if (reason === 'paid') bonus = 80;
  else if (reason === 'escaped') bonus = 10;
  changeReputation(bonus);
  if (state.reputation > -10) state.reputation = -10;
  document.getElementById('jailOverlay').style.display = 'none';
  if (player) { player.setVisible(true); }
  document.querySelectorAll('.tbtn').forEach(b => b.style.display = '');
  document.getElementById('hud').style.display = '';
  document.getElementById('clock').style.display = '';
  document.getElementById('log').style.display = '';
  const label = reason === 'served' ? 'отсидел' : reason === 'paid' ? 'заплатил' : 'сбежал';
  log(`🔓 Ты вышел из тюрьмы (${label}). +${bonus} к репутации.`);
  showEventBanner(`🔓 +${bonus} репутации`);
  renderHUD();
}
document.getElementById('jailPayBtn').onclick = () => {

function spawnPolice(){
  if (policeChase && policeChase.sprite && policeChase.sprite.active) return;
  const scene = game.scene.scenes[0];
  if (!scene || !player) return;
  const groundY = scene.groundY;
  const npc = scene.physics.add.sprite(player.x + (player.flipX?-300:300), groundY - 24, 'npc_cop');
  npc.body.setSize(24, 48); npc.body.setOffset(4, 8);
  npc.isThug = true; npc.isNpc = true; npc.isCop = true;
  npc.hp = 100; npc.maxHp = 100;
  npc.hitsLanded = 0;
  npc.lastAttack = 0;
  npc.setDepth(15);
  scene.physics.add.collider(npc, scene.groundBody);
  npcs.push(npc);
  policeChase = { sprite: npc };
  log('👮 Полицейский гонится за тобой!');
}
function updatePoliceChase(time, delta){
  if (!policeChase || inJail) return;
  if (!policeChase.sprite || !policeChase.sprite.active) {
    policeChase = null;
    policeSpawnCooldown = 10000;
    return;
  }
  const cop = policeChase.sprite;
  const dist = Phaser.Math.Distance.Between(player.x, player.y, cop.x, cop.y);
  const dir = player.x > cop.x ? 1 : -1;
  if (dist > 55) {
    cop.body.setVelocityX(dir * 180);
  } else {
    cop.body.setVelocityX(0);
  }
  cop.flipX = dir < 0;
  if (dist < 65 && (!cop.lastAttack || time - cop.lastAttack > 1000)) {
    cop.lastAttack = time;
    cop.hitsLanded++;
    const dmg = 5;
    state.hp = Math.max(0, state.hp - dmg);
    game.scene.scenes[0].tweens.add({ targets: cop, angle: dir<0?-20:20, yoyo:true, duration:100 });
    AudioSys.play('punch');
    log(`👮 Полицейский бьёт тебя! (${cop.hitsLanded}/5)`);
    if (cop.hitsLanded >= 5) {
      log('👮 Полицейский скрутил тебя!');
      goToJail();
      return;
    }
    if (state.hp <= 0) die('Тебя забили гопники.');
  }
}

function updateDogCombat(time, delta){
  if (!petDogSprite || !petDogSprite.active || inJail || isDead) return;
  let target = null, minDist = 120;
  npcs.forEach(npc => {
    if (!npc.active || !npc.isThug) return;
    const d = Phaser.Math.Distance.Between(petDogSprite.x, petDogSprite.y, npc.x, npc.y);
    if (d < minDist) { minDist = d; target = npc; }
  });
  if (target) {
    const dir = target.x > petDogSprite.x ? 1 : -1;
    petDogSprite.body.setVelocityX(dir * 250);
    petDogSprite.flipX = dir < 0;
    if (minDist < 40) {
      if (!petDogSprite.lastBite || time - petDogSprite.lastBite > 800) {
        petDogSprite.lastBite = time;
        target.hp -= 3;
        target.setTint(0xff6666);
        game.scene.scenes[0].time.delayedCall(150, () => { if(target.active) target.clearTint(); });
        spawnHitEffect(target.x, target.y - 10, 'punch');
        if (target.hp <= 0) {
          if (target.hpBar) target.hpBar.destroy();
          spawnLoot(target); target.destroy(); npcs = npcs.filter(n => n.active);
          if (target.isThug && !target.isBoss) { records.kills++; currentKills++; }
          if (target.isBoss) records.bosses++;
          updateRecords();
        }
      }
    }
  }
}

function equipSlotIndex(i){
  const s=state.slots[i]; if(!s) return;
  const item=ITEMS[s.id];
  if(item.use==='eat'){ if(invCount(s.id)<=0) return; state.hunger=Math.min(100,state.hunger+40); invRemove(s.id,1); log('Съел еду'); return; }
  if(item.use==='drink'){
    if(invCount(s.id)<=0) return;
    if(s.id==='vodka'){ state.hp=Math.min(100,state.hp+10); state.water=Math.max(0,state.water-20); invRemove(s.id,1); log('Выпил водки — полегчало, но сушняк'); return; }
    state.water=Math.min(100,state.water+40); invRemove(s.id,1); invAdd('bottle',1); log('Выпил воду'); return;
  }
  if(item.type==='mat'){ log('Материал.'); return; }
  if(state.equip[item.slot]){
    const old=state.equip[item.slot];
    state.slots[i]=null;
    const oldAdded = addToSlots(state.slots, old, 1);
    if(oldAdded<1){ state.slots[i]={id:old,count:1}; AudioSys.play('error'); log('❌ Инвентарь заполнен'); return; }
    state.equip[item.slot]=s.id;
  } else {
    state.equip[item.slot]=s.id;
    state.slots[i]=null;
  }
  syncInv(); renderUI(); updateSprite();
  log('Надето: '+item.name);
}
function unequip(slot){
  if(state.equip[slot]){
    const added = addToSlots(state.slots, state.equip[slot], 1);
    if(added<1){ AudioSys.play('error'); log('❌ Инвентарь заполнен'); return; }
    state.equip[slot]=null;
    syncInv(); renderUI(); updateSprite();
  }
}
function craft(outId){ const r=RECIPES.find(x=>x.out===outId); if(!r) return; for(const [k,v] of Object.entries(r.cost)) if(invCount(k)<v){ log('Нужно: '+ITEMS[k].name); return; } for(const [k,v] of Object.entries(r.cost)) invRemove(k,v); invAdd(outId,1); log('Скрафчено: '+ITEMS[outId].name); }

function pickupTextureFor(id){

    food:'item_food', water_bottle:'item_water', rag:'item_rag_mat',
    rozochka:'item_rozochka', bottle:'item_bottle', coin:'item_coin'
  };

}
function dropFromSlot(i){
  const s = state.slots[i]; if(!s) return;

function renderStash(){
  const grid=document.getElementById('stashGrid'); if(!grid) return;
  grid.innerHTML='';
  for(let i=0;i<INV_SIZE;i++){
    const s=state.stashSlots[i];
    const cell=document.createElement('div');
    cell.className='slot'+(s?'':' empty');
    if(s){ cell.textContent=ITEMS[s.id].icon; if(s.count>1){const c=document.createElement('span');c.className='count';c.textContent=s.count;cell.appendChild(c);} }
    let lastTap = 0;
    cell.onclick = () => {
      const now = Date.now();
      if (now - lastTap < 300) {
        if(s){ const added=addToSlots(state.slots,s.id,s.count); if(added>0){ s.count-=added; if(s.count<=0) state.stashSlots[i]=null; syncInv(); renderUI(); renderStash(); } else { AudioSys.play('error'); log('❌ Инвентарь заполнен'); showEventBanner('❌ Инвентарь заполнен!'); } }
        hideTooltip();
      } else {
        if(s && document.getElementById('tooltip').style.display === 'block') { hideTooltip(); }
        else { const r = cell.getBoundingClientRect(); if(s) showTooltip(s.id, r.left + r.width/2, r.top); }
      }
      lastTap = now;
    };
    cell.onmouseleave = hideTooltip;
    grid.appendChild(cell);
  }
}
function stashAll(){
  for(let i=0;i<state.slots.length;i++){
    const s=state.slots[i]; if(!s) continue;
    const added=addToSlots(state.stashSlots,s.id,s.count);
    if(added>0){ s.count-=added; if(s.count<=0) state.slots[i]=null; }
  }
  syncInv(); renderUI(); renderStash();
}
function unstashAll(){
  for(let i=0;i<state.stashSlots.length;i++){
    const s=state.stashSlots[i]; if(!s) continue;
    const added=addToSlots(state.slots,s.id,s.count);
    if(added>0){ s.count-=added; if(s.count<=0) state.stashSlots[i]=null; }
  }
  syncInv(); renderUI(); renderStash();
}
function openStash(){ document.getElementById('stashPanel').classList.add('open'); renderStash(); }

function openShop(type){

  list.innerHTML=''; panel.classList.add('open');

  if(type==='shop'){
    title.textContent='🏪 Магазин' + (repDiscount<1?' (скидка 20%)':repDiscount>1?' (наценка 20%)':'');
    ['water_bottle','food','beer','vodka','tape','metal','leather'].forEach(id=>{

      const btn=document.createElement('button'); btn.textContent='Купить'; btn.disabled=invCount('coin')<price;

    });

    btn.onclick=()=>{ if(invCount(c.item)>0){ invRemove(c.item,1); invAdd('coin',c.price); if(type==='bottles') changeReputation(0.5); log('Сдано.'); openShop(type); } };

    title.textContent='🏦 Банк';

    row.innerHTML=`<span>На счету:</span> <span style="color:gold">${state.bank} 🪙</span>`; list.appendChild(row);

    const btn2=document.createElement('button'); btn2.textContent='Внести'; btn2.disabled=invCount('coin')<=0;
    btn2.onclick=()=>{ const amt=invCount('coin'); if(amt>0){ invRemove('coin',amt); state.bank+=amt; log(`Внёс ${amt} 🪙`); openShop('bank'); } };
    row2.appendChild(btn2); list.appendChild(row2);
    const row3=document.createElement('div'); row3.className='shop-row';
    row3.innerHTML=`<span>Снять всё</span> <span>${state.bank} 🪙</span>`;
    const btn3=document.createElement('button'); btn3.textContent='Снять'; btn3.disabled=state.bank<=0;
    btn3.onclick=()=>{ const amt=state.bank; if(amt>0){ state.bank=0; invAdd('coin',amt); log(`Снял ${amt} 🪙`); openShop('bank'); } };
    row3.appendChild(btn3); list.appendChild(row3);
    const row4=document.createElement('div'); row4.className='shop-row';

    const btn4=document.createElement('button'); btn4.textContent='Пожертвовать'; btn4.disabled=invCount('coin')<50;
    btn4.onclick=()=>{ if(invCount('coin')>=50){ invRemove('coin',50); changeReputation(2); log('🙏 Пожертвовал 50 монет (+2 репутации)'); openShop('bank'); } };
    row4.appendChild(btn4); list.appendChild(row4);

function triggerRandomEvent() {
  const roll = Math.random();
  if (roll < 0.20) { const amt = 10 + Math.floor(Math.random()*40); invAdd('coin', amt); log(`💼 Нашёл кошелёк! +${amt} монет`); showEventBanner(`💼 +${amt} 🪙`); }
  else if (roll < 0.40) { const dmg = 5 + Math.floor(Math.random()*10); state.hp = Math.max(0, state.hp - dmg); log(`🐕 Собака укусила! -${dmg} HP`); showEventBanner(`🐕 -${dmg} ❤️`); }
  else if (roll < 0.60) { invAdd('food',1); log('👴 Добрый прохожий дал еду'); showEventBanner('👴 +🍞'); }
  else if (roll < 0.75) { const stolen = invCount('coin'); if (stolen > 0) { invRemove('coin', stolen); log(`💀 Гопники обчистили! -${stolen}`); showEventBanner(`💀 -${stolen} 🪙`); } else log('💀 Гопники прошли мимо'); }
  else if (roll < 0.90) { invAdd('vodka',1); log('🍶 Нашёл водку'); showEventBanner('🍶 Водка!'); }
  else { const amt = 5 + Math.floor(Math.random()*10); invAdd('coin', amt); log(`✨ +${amt} 🪙`); showEventBanner(`✨ +${amt} 🪙`); }
}

function feedDog() {
  if (!state.petDog) { log('🐕 Нет собаки'); return; }
  if (invCount('food') < 1) { log('🐕 Нужна еда'); return; }
  if (state.dogHunger >= 50) {
    log('🐕 Собака не голодна');
    showEventBanner('🐕 Собака сыта');
    return;
  }
  const now = performance.now();
  if (now - lastDogFeed < DOG_FEED_CD) {
    const left = Math.ceil((DOG_FEED_CD - (now - lastDogFeed)) / 1000);
    log(`🐕 Собака ещё не проголодалась (${left} с)`);
    return;
  }
  invRemove('food', 1);
  state.dogHunger = Math.min(100, state.dogHunger + 30);
  lastDogFeed = now;
  changeReputation(1);
  log('🐕 Собака накормлена (+1 репутации)');

function updateTimeOfDay(delta){
  worldTime += delta * 0.0017;
  if(worldTime >= 24*60){ worldTime -= 24*60; worldDay++; }
  const hours = Math.floor(worldTime/60), mins = Math.floor(worldTime%60);
  const daysInMonth2027 = [31,28,31,30,31,30,31,31,30,31,30,31];
  const FIRST_DAY_OFFSET = 4;
  const dayOfYear = (worldDay - 1) % 365;
  let monthIndex = 0, dayInMonth = dayOfYear + 1, accumulated = 0;
  for (let i = 0; i < 12; i++) { if (dayInMonth <= accumulated + daysInMonth2027[i]) { monthIndex = i; dayInMonth = dayInMonth - accumulated; break; } accumulated += daysInMonth2027[i]; }
  currentYear = 2027;
  const dayOfWeekIndex = (FIRST_DAY_OFFSET + dayOfYear) % 7;
  let season='winter';
  if(monthIndex>=2&&monthIndex<=4) season='spring';
  else if(monthIndex>=5&&monthIndex<=7) season='summer';
  else if(monthIndex>=8&&monthIndex<=10) season='autumn';
  let timeStr='', skyColor=0x5dade2;
  if(hours>=6&&hours<12){ timeStr='Утро'; skyColor=0x87CEEB; }
  else if(hours>=12&&hours<18){ timeStr='День'; skyColor=0x5dade2; }
  else if(hours>=18&&hours<21){ timeStr='Вечер'; skyColor=0xffaa77; }
  else { timeStr='Ночь'; skyColor=0x0a0a1a; }
  if(currentWeather==='rain') skyColor = hours>=6&&hours<21 ? 0x4a6a8a : 0x050510;
  if(currentWeather==='storm') skyColor = hours>=6&&hours<21 ? 0x304050 : 0x020208;
  if(currentWeather==='snow') skyColor = hours>=6&&hours<21 ? 0xaad0e8 : 0x1a1a2a;
  weatherTimer += delta;
  if(weatherTimer>30000){ weatherTimer = 0; let r = Math.random();
    if(season==='spring') currentWeather = r>0.6 ? 'rain' : 'clear';
    else if(season==='summer') currentWeather = r>0.8 ? 'storm' : (r>0.5 ? 'rain' : 'clear');
    else if(season==='autumn') currentWeather = r>0.8 ? 'storm' : (r>0.4 ? 'rain' : 'clear');
    else currentWeather = r>0.7 ? 'snow' : 'clear'; }
  if(currentWeather==='storm' && Math.random()<0.005) lightningAlpha = 0.8;
  if(lightningAlpha > 0){ lightningAlpha -= delta*0.005; if(lightningAlpha < 0) lightningAlpha = 0; }
  let icon = '☀️'; if(currentWeather==='rain') icon='🌧️'; if(currentWeather==='snow') icon='❄️'; if(currentWeather==='storm') icon='⛈️';
  document.getElementById('timeText').textContent = `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')} (${timeStr})`;
  document.getElementById('dayText').textContent = `${daysOfWeek[dayOfWeekIndex]}, ${dayInMonth} ${months[monthIndex]} ${currentYear}`;
  document.getElementById('weatherText').textContent = `${icon} ${currentWeather==='clear'?'Ясно':currentWeather==='rain'?'Дождь':currentWeather==='snow'?'Снег':'Гроза'}`;
  const scene = game.scene.scenes[0];
  if(scene && scene.cameras && scene.cameras.main) scene.cameras.main.setBackgroundColor(skyColor);
  const isNight = (hours>=21 || hours<6);
  for (let i = litWindows.length - 1; i >= 0; i--) { const w = litWindows[i]; if (!w.active) { litWindows.splice(i,1); continue; } const target = isNight ? (w.isLit ? w.litColor : w.baseColor) : w.baseColor; if (w.fillColor !== target) w.setFillStyle(target); }
  if (worldDay !== lastEventDay) {
    lastEventDay = worldDay;
    triggerRandomEvent();
    if (Math.random() < 0.3) helpGrandma();
  }
  const newPhase = getTodPhase();
  if(newPhase !== lastPhase){ lastPhase = newPhase; onPhaseChange(newPhase); }
}
function updateWeatherParticles(delta){
  if(!weatherLayer) return;
  weatherLayer.clear();
  const W = game.scene.scenes[0].scale.width, H = game.scene.scenes[0].scale.height;
  if(lightningAlpha > 0){ weatherLayer.fillStyle(0xffffff, lightningAlpha); weatherLayer.fillRect(0,0,W,H); }
  if(currentWeather==='rain'||currentWeather==='storm'){ for(let i=0;i<5;i++) if(weatherParticles.length<200) weatherParticles.push({x:Math.random()*W,y:-10,vx:-0.5,vy:10+Math.random()*5,type:'rain',size:1+Math.random()*1.5,life:2000}); }
  else if(currentWeather==='snow'){ for(let i=0;i<3;i++) if(weatherParticles.length<150) weatherParticles.push({x:Math.random()*W,y:-10,vx:(Math.random()-0.5)*0.8,vy:1.5+Math.random()*1.5,type:'snow',size:1.5+Math.random()*2,life:10000,wobble:Math.random()*Math.PI*2}); }
  for(let i=weatherParticles.length-1;i>=0;i--){ const p = weatherParticles[i]; p.x += p.vx; p.y += p.vy; p.life -= delta;
    if(p.type==='snow'){ p.wobble += 0.02; p.x += Math.sin(p.wobble)*0.4; }
    if(p.y>H+20||p.life<=0){ weatherParticles.splice(i,1); continue; }
    if(p.type==='rain'){ weatherLayer.fillStyle(0xaaddff,0.7); weatherLayer.fillRect(p.x,p.y,p.size,10); }
    else if(p.type==='snow'){ weatherLayer.fillStyle(0xffffff,0.9); weatherLayer.fillCircle(p.x,p.y,p.size); } }
}

function isPositionFree(x, minDist) {
  for (const b of buildings) { if (b.active && Math.abs(b.x - x) < minDist) return false; }
  for (const t of trashBags) { if (t.active && Math.abs(t.x - x) < minDist) return false; }
  if (traderNpc && traderNpc.active && Math.abs(traderNpc.x - x) < minDist) return false;
  if (petDogSprite && petDogSprite.active && Math.abs(petDogSprite.x - x) < minDist) return false;
  return true;
}

function create(){
  const H = this.scale.height;
  this.cameras.main.setBackgroundColor(0x5dade2);
  
  this.groundY = H - 60;
  this.groundBody = this.add.rectangle(-500000, this.groundY, 1000000, 40, 0x2a3a2a).setOrigin(0,0).setDepth(1);
  this.physics.add.existing(this.groundBody, true);
  this.groundBody.body.setSize(1000000, 40); this.groundBody.body.updateFromGameObject();
  this.road = this.add.rectangle(-500000, this.groundY + 20, 1000000, 40, 0x555555).setOrigin(0,0).setDepth(2);
  this.sidewalk = this.add.rectangle(-500000, this.groundY - 10, 1000000, 10, 0x888888).setOrigin(0,0).setDepth(2);

  this.scale.on('resize', (gameSize) => {
    this.groundY = gameSize.height - 60;
    this.groundBody.y = this.groundY;
    this.groundBody.body.updateFromGameObject();
    this.road.y = this.groundY + 20;
    this.sidewalk.y = this.groundY - 10;
    if (player && player.body) player.y = this.groundY - 48;
  });

  this.anims.create({ key:'bum_walk_anim', frames:[{key:'bum_walk1'},{key:'bum_walk2'}], frameRate:8, repeat:-1 });
  this.anims.create({ key:'civ_m_walk', frames:[{key:'npc_m1'},{key:'npc_m2'}], frameRate:6, repeat:-1 });
  this.anims.create({ key:'civ_f_walk', frames:[{key:'npc_f1'},{key:'npc_f2'}], frameRate:6, repeat:-1 });
  this.anims.create({ key:'trader_walk', frames:[{key:'npc_trader1'},{key:'npc_trader2'}], frameRate:6, repeat:-1 });
  
  player = this.physics.add.sprite(0, this.groundY - 48, 'bum_idle').setDepth(10);
  player.body.setSize(24, 48); player.body.setOffset(4, 8);
  player.setCollideWorldBounds(false);
  this.physics.add.collider(player, this.groundBody);
  this.cameras.main.startFollow(player, true, 0.1, 0.1);
  weaponSprite = this.add.sprite(player.x, player.y, 'w_bottle').setDepth(11).setVisible(false);
  weatherLayer = this.add.graphics(); weatherLayer.setDepth(10.5); weatherLayer.setScrollFactor(0);
  lastPhase = getTodPhase();
  const NPC_Y = this.groundY - 24;
  for (let i = 0; i < 6; i++) {
    const isFemale = i % 2 === 0;
    const tex = isFemale ? 'npc_f' : 'npc_m';
    const npc = this.physics.add.sprite(-150 + i*120, NPC_Y, tex);
    npc.body.setSize(24, 48); npc.body.setOffset(4, 8);
    npc.isThug = false; npc.isNpc = true; npc.hp = 20; npc.maxHp = 20;
    npc.didDrop = false; npc.dir = i%3===0?1:-1; npc.isFemale = isFemale;
    npc.setDepth(15); this.physics.add.collider(npc, this.groundBody); npcs.push(npc);
  }
  log('Старт. NPC: ' + npcs.length);
  if (window.__savedX !== undefined && window.__savedX !== 0) {
    player.x = window.__savedX;
    const savedChunk = Math.floor(player.x / CHUNK_W);
    for (let i = savedChunk - 2; i <= savedChunk + 2; i++) generateChunk(i);
  } else { for (let i = -2; i <= 2; i++) generateChunk(i); }
  renderUI();
  if (state.petDog) {
    document.getElementById('dogIndicator').style.display = 'flex';
    if (!petDogSprite || !petDogSprite.active) {
      petDogSprite = this.physics.add.sprite(player.x - 40, player.y - 20, 'npc_dog').setDepth(12);
      petDogSprite.body.setSize(40, 32); petDogSprite.body.setAllowGravity(true);
      this.physics.add.collider(petDogSprite, this.groundBody);
    }
  }
  if (state.equip.weapon) updateSprite();
  saveGame();
}

function generateChunk(idx){
  if(loadedChunks.has(idx)) return;
  const scene = game.scene.scenes[0];
  const startX = idx * CHUNK_W;
  const groundY = scene.groundY;
  const NPC_Y = groundY - 24;
  const objs = [];
  for(let i=0; i<2; i++){
    let h = 200 + Math.random()*150, w = 120 + Math.random()*80;
    let x = startX + i*(CHUNK_W/2) + 40;
    objs.push(scene.add.rectangle(x+w/2, groundY, w, h, 0x151820).setOrigin(0.5,1).setDepth(-20));
    objs.push(scene.add.triangle(x+w/2, groundY-h, 0,40, w/2+10,0, w+20,40, 0x0d1015).setOrigin(0.5,1).setDepth(-20));
    for(let wy = groundY-40; wy > groundY-h; wy -= 40){ for(let wx = x+20; wx < x+w-20; wx += 30){
      let isLit = Math.random() > 0.4;
      let win = scene.add.rectangle(wx, wy, 16, 20, 0x111111).setDepth(-15);

function unloadChunk(idx){
  if(!loadedChunks.has(idx)) return;
  loadedChunks.get(idx).forEach(o=>{ if(o.active){ if(o.hpBar) o.hpBar.destroy(); o.destroy(); } });
  npcs = npcs.filter(n=>{ if(!n.active) return false; if(Math.floor(n.x / CHUNK_W) === idx){ if(n.hpBar) n.hpBar.destroy(); n.destroy(); return false; } return true; });
  trashBags = trashBags.filter(t=>t.active);
  buildings = buildings.filter(b=>b.active);
  loadedChunks.delete(idx); npcChunks.delete(idx);
  if (traderNpc && traderNpc.active && Math.floor(traderNpc.x / CHUNK_W) === idx) { traderNpc.destroy(); traderNpc = null; }
  if (petDogSprite && petDogSprite.active && Math.floor(petDogSprite.x / CHUNK_W) === idx) {
    petDogSprite.x = player.x - 40;
    petDogSprite.y = player.y - 20;
  }
  if (beggarNpc && beggarNpc.active && Math.floor(beggarNpc.x / CHUNK_W) === idx) {
    if (beggarNpc.begCan) beggarNpc.begCan.destroy();
    beggarNpc.destroy();
    beggarNpc = null;
  }
}

let _actionMenuCloser = null;
function openItemActionMenu(x, y, slotIndex, itemId){
  const menu = document.getElementById('actionMenu');
  menu.innerHTML = '';
  menu.style.display = 'flex';
  menu.style.left = Math.min(window.innerWidth - 160, x) + 'px';
  menu.style.top = Math.max(10, y - 100) + 'px';

  const it = ITEMS[itemId];
  const title = document.createElement('div');
  title.style.padding = '4px 8px'; title.style.fontSize = '12px'; title.style.color = '#e8b860'; title.style.fontWeight = 'bold';
  title.textContent = `${it.icon} ${it.name}`;
  menu.appendChild(title);

  const btnEquip = document.createElement('button');
  btnEquip.textContent = 'Надеть';
  btnEquip.onclick = () => { equipSlotIndex(slotIndex); menu.style.display = 'none'; };
  menu.appendChild(btnEquip);

  const btnDrop = document.createElement('button');
  btnDrop.className = 'danger';
  btnDrop.textContent = '🗑 Выбросить';
  btnDrop.onclick = () => { dropFromSlot(slotIndex); menu.style.display = 'none'; };
  menu.appendChild(btnDrop);

  if (_actionMenuCloser) document.removeEventListener('click', _actionMenuCloser);
  _actionMenuCloser = function closeMenu(e){
    if (!menu.contains(e.target)) {
      menu.style.display = 'none';
      document.removeEventListener('click', _actionMenuCloser);
      _actionMenuCloser = null;
    }
  };
  setTimeout(() => { if (_actionMenuCloser) document.addEventListener('click', _actionMenuCloser); }, 100);

function renderInventory(){
  document.querySelectorAll('.eq-slot').forEach(el=>{
    const slot=el.dataset.slot, eqItem=state.equip[slot], real=el.querySelector('.real');
    if(real) real.textContent=eqItem?ITEMS[eqItem].icon:'';
    el.classList.toggle('active',!!eqItem);
    if(el._bound) return; el._bound=true;

    let lastTap = 0;
    el.onclick = () => {
      const now = Date.now();
      if (now - lastTap < 300) {
        unequip(slot);
        hideTooltip();
      } else {
        if(eqItem && document.getElementById('tooltip').style.display === 'block') hideTooltip();
        else { const r = el.getBoundingClientRect(); if(eqItem) showTooltip(eqItem, r.left + r.width/2, r.top); }
      }
      lastTap = now;
    };
    el.onmouseleave = hideTooltip;
  });

  const grid=document.getElementById('invGrid');
  grid.innerHTML='';
  const gridWrapper = grid.parentElement;
  if (gridWrapper && !gridWrapper._scrollBound) {
    gridWrapper._scrollBound = true;
    gridWrapper.addEventListener('scroll', hideTooltip);
  }

  for(let i=0;i<INV_SIZE;i++){
    const s=state.slots[i];
    const cell=document.createElement('div');
    cell.className='slot'+(s?'':' empty');
    if(s){
      cell.textContent=ITEMS[s.id].icon;
      if(s.count>1){ const c=document.createElement('span'); c.className='count'; c.textContent=s.count; cell.appendChild(c); }
    }
    let lastTap = 0;
    let longPressTimer = null;
    let longPressed = false;

    cell.onclick = () => {
      if (longPressed) { longPressed = false; return; }
      const now = Date.now();
      if (now - lastTap < 300) {
        if(s) equipSlotIndex(i);
        hideTooltip();
      } else {
        if(s && document.getElementById('tooltip').style.display === 'block') hideTooltip();
        else { const r = cell.getBoundingClientRect(); if(s) showTooltip(s.id, r.left + r.width/2, r.top); }
      }
      lastTap = now;
    };
    cell.oncontextmenu = (e) => { e.preventDefault(); return false; };
    cell.addEventListener('touchstart', (e) => {
      if (!s) return;
      longPressed = false;
      longPressTimer = setTimeout(() => {
        longPressed = true;
        const r = cell.getBoundingClientRect();
        openItemActionMenu(r.left + r.width/2, r.top, i, s.id);
      }, 500);
    }, { passive: true });
    const cancelLong = () => { if (longPressTimer) clearTimeout(longPressTimer); };
    cell.addEventListener('touchend', cancelLong);
    cell.addEventListener('touchmove', cancelLong);
    cell.addEventListener('touchcancel', cancelLong);
    cell.addEventListener('mousedown', (e) => {
      if (e.button === 2 && s) {
        const r = cell.getBoundingClientRect();
        openItemActionMenu(r.left + r.width/2, r.top, i, s.id);
      }
    });
    cell.onmouseleave = hideTooltip;
    grid.appendChild(cell);
  }
}

function bindHold(id,prop){ const el=document.getElementById(id); const on=e=>{e.preventDefault();held[prop]=true;el.classList.add('held');}; const off=e=>{e.preventDefault();held[prop]=false;el.classList.remove('held');}; el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off,{passive:false}); el.addEventListener('touchcancel',off,{passive:false}); el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off); }

function die(reason){
  if (isDead) return;
  isDead = true; state.hp = 0;
  if (isSitting) standUp();
  if (isHiding) { isHiding = false; document.getElementById('hideOverlay').style.display = 'none'; }
  bossLootCache = {};
  document.getElementById('deathScreen').style.display = 'flex';
  document.getElementById('deathReason').textContent = reason || 'Ты не выжил...';
  log('☠️ ' + (reason || 'Ты умер'));
}
function respawn(){
  isDead = false; state.hp = 100; state.hunger = 100; state.water = 100;
  currentKills = 0; activeQuest = null;
  lastWarnCold = false; lastWarnHunger = false; lastWarnWater = false;
  isHiding = false; document.getElementById('hideOverlay').style.display = 'none';
  if (state.petDog && petDogSprite && petDogSprite.active) { petDogSprite.x = player.x - 40; petDogSprite.y = player.y - 20; }
  document.getElementById('deathScreen').style.display = 'none';
  log('Очнулся.'); renderUI(); updateQuestBox();
}
function doAttack(){
  if(!player || attackCooldown>0 || isDead || isSitting) return;
  attackCooldown = 400;
  game.scene.scenes[0].tweens.add({ targets:player, angle:player.flipX?-15:15, yoyo:true, duration:100 });
  const wep = state.equip.weapon; let dmg = 2, effect = 'punch';
  if(wep){ dmg = ITEMS[wep].dmg; effect = ITEMS[wep].effect; }
  AudioSys.play(effect);
  const dir = player.flipX ? -1 : 1;
  if(weaponSprite && weaponSprite.visible) game.scene.scenes[0].tweens.add({ targets:weaponSprite, angle:dir*60, yoyo:true, duration:100 });
  npcs.forEach(npc=>{
    if(!npc.active) return;
    const dx = (npc.x - player.x) * dir;
    if(dx>0 && dx<80 && Math.abs(npc.y-player.y)<60){
      npc.hp -= dmg;
      if(npc.isAnimal){ npc.dir = npc.x > player.x ? 1 : -1; }
      else if(!npc.isThug){ npc.isThug=true; npc.setTexture(npc.isFemale?'npc_thug_f':'npc_thug_m'); log('Прохожий в ярости!'); changeReputation(-3); }
      spawnHitEffect(player.x+dir*30, player.y-10, effect);
      npc.setTint(0xff6666);
      game.scene.scenes[0].time.delayedCall(150, ()=>{ if(npc.active) npc.clearTint(); });
      if(npc.hp<=0){ if(npc.hpBar) npc.hpBar.destroy(); spawnLoot(npc); npc.destroy(); npcs = npcs.filter(n=>n.active); if(npc.isThug && !npc.isBoss) { records.kills++; currentKills++; } if(npc.isBoss) records.bosses++; updateRecords(); }
    }
  });
}
function spawnLoot(npc){
  const scene = game.scene.scenes[0];
  let drops = [];
  if(npc.isBoss){ drops = ['crowbar','leather_jacket','coin','coin','armor_plate','katana']; Object.keys(bossLootCache).forEach(item=>{ drops.push(...Array(bossLootCache[item]).fill(item)); }); bossLootCache = {}; }
  else if(npc.isThug) drops = ['pipe','shiv','cap','cardboard','rag','metal','coin','bottle','beer','hammer'];
  else if(npc.isAnimal) drops = ['food','coin'];
  else drops = ['food','water_bottle','coin','rag','cap','boots','jeans','plastic','glass'];
  const seen = new Set();
  const uniq = drops.filter(d => { if(seen.has(d)) return Math.random()>0.4; seen.add(d); return true; });
  const final = uniq.slice(0, 6);
  final.forEach(drop => {
    const s = scene.add.sprite(npc.x+(Math.random()*40-20), npc.y-20, pickupTextureFor(drop)).setScale(1.5);
    s.itemId = drop; s.isPickup = true;
    scene.tweens.add({ targets:s, y:s.y-8, yoyo:true, repeat:-1, duration:1000 });
  });
}
function doThrow(){
  if(!player || throwCooldown>0 || isDead || isSitting) return;
  let wep=null;
  if(invCount('bottle')>0) wep='bottle'; else if(invCount('rozochka')>0) wep='rozochka';
  if(!wep) return;
  throwCooldown = 800; invRemove(wep,1);
  const dir = player.flipX ? -1 : 1;
  let proj = game.scene.scenes[0].add.circle(player.x+dir*20, player.y-10, 5, wep==='bottle'?0x44aa44:0xaa4444);
  proj.dmg = ITEMS[wep].dmg; proj.wepType = wep;
  game.scene.scenes[0].physics.add.existing(proj);
  proj.body.setVelocity(dir*600, -200); proj.body.setGravityY(500);
  projectiles.push(proj);
  log(`Брошена ${ITEMS[wep].name}!`);
}
function spawnHitEffect(x,y,type){
  const scene = game.scene.scenes[0];
  if(type==='slash'){ let t=scene.add.text(x,y,'///',{fontSize:'24px',color:'#fff'}).setOrigin(0.5); scene.tweens.add({targets:t,alpha:0,scaleX:2,duration:200,onComplete:()=>t.destroy()}); }
  else if(type==='blunt'){ let t=scene.add.text(x,y,'✦',{fontSize:'30px',color:'#ffaa00'}).setOrigin(0.5); scene.tweens.add({targets:t,alpha:0,scale:2,duration:250,onComplete:()=>t.destroy()}); scene.cameras.main.shake(50,0.01); }
  else if(type==='glass'){ for(let i=0;i<4;i++){ let shard=scene.add.circle(x,y,3,0x88ee88); scene.tweens.add({targets:shard,x:x+(Math.random()*40-20),y:y+(Math.random()*40-20),alpha:0,duration:300,onComplete:()=>shard.destroy()}); } }
  else if(type==='punch'){ let t=scene.add.circle(x,y,10,0xffffff); scene.tweens.add({targets:t,alpha:0,scale:2,duration:150,onComplete:()=>t.destroy()}); }
}

function update(time, delta){
  if (inJail) { updateJail(delta); return; }
  if(!player || !player.body || isHiding){ if(weatherLayer) updateWeatherParticles(delta); return; }
  if(isDead){ if(weatherLayer) updateWeatherParticles(delta); return; }
  updateTimeOfDay(delta);
  updateWeatherParticles(delta);
  applyWeatherEffects(delta);
  applySeasonEffects();
  checkWarnings();
  checkAchievements();
  checkWin();
  checkQuests();
  tickFoodAges();

  if (state.reputation <= -100) {
    policeSpawnCooldown -= delta;
    if (policeSpawnCooldown <= 0 && (!policeChase || !policeChase.sprite || !policeChase.sprite.active)) {
      spawnPolice();
      policeSpawnCooldown = 10000;
    }
  }
  if (policeChase) updatePoliceChase(time, delta);
  updateDogCombat(time, delta);

  if (!beggarNpc || !beggarNpc.active) {
    if (Math.random() < 0.0002) spawnBeggar();
  }

  if(businessLevel>0){
    businessTimer += delta;
    if(businessTimer>=5000){ businessTimer=0; invAdd('coin', businessLevel); log(`Бизнес принес ${businessLevel} 🪙`); }
  }
  state.hunger = Math.max(0, state.hunger - delta*0.00005);
  state.water = Math.max(0, state.water - delta*0.00007);
  if(state.hunger<=0 || state.water<=0){ state.hp = Math.max(0, state.hp - delta*0.005); }
  const speed = 200;
  if(!isSitting){
    player.body.setVelocityX(0);
    if(held.left){ player.body.setVelocityX(-speed); player.flipX=true; player.anims.play('bum_walk_anim',true); }
    else if(held.right){ player.body.setVelocityX(speed); player.flipX=false; player.anims.play('bum_walk_anim',true); }
    else { player.anims.stop(); player.setTexture('bum_idle'); }
    const onGround = player.body.blocked.down || player.body.touching.down;
    if(held.jump && onGround){ player.body.setVelocityY(-600); held.jump=false; }
  }
  if(state.equip.weapon && weaponSprite && !isSitting){ weaponSprite.setVisible(true); const tex = weaponTexture(state.equip.weapon); if(weaponSprite.texture.key !== tex) weaponSprite.setTexture(tex); const dir = player.flipX ? -1 : 1; weaponSprite.x = player.x + dir*18; weaponSprite.y = player.y - 10; weaponSprite.flipX = player.flipX; }
  else if(weaponSprite) weaponSprite.setVisible(false);
  if(attackCooldown>0) attackCooldown-=delta;
  if(throwCooldown>0) throwCooldown-=delta;
  npcs.forEach(npc=>{
    if(!npc.active) return;
    if(npc.isCop) return;
    if(npc.hp < npc.maxHp){ if(!npc.hpBar) npc.hpBar = game.scene.scenes[0].add.rectangle(npc.x,npc.y-40,30,4,0xd34b4b).setDepth(16); npc.hpBar.x=npc.x-15; npc.hpBar.y=npc.y-40; npc.hpBar.width=30*(npc.hp/npc.maxHp); }
    const dist = Phaser.Math.Distance.Between(player.x, player.y, npc.x, npc.y);
    if(!npc.isThug){
      npc.body.setVelocityX(npc.dir * (npc.isAnimal ? 60 : 40));
      npc.flipX = npc.dir < 0;
      if(npc.isAnimal) { }
      else if(npc.body.blocked.down) npc.anims.play(npc.isFemale?'civ_f_walk':'civ_m_walk', true);
      if(isSitting && !npc.didDrop && dist<60 && !npc.isAnimal){
        npc.didDrop = true;
        setTimeout(()=>{ const r = Math.random(); if(r<0.4){ invAdd('coin',1+Math.floor(Math.random()*3)); log('Прохожий бросил монетку.'); } else if(r<0.8){ invAdd('food',1); log('Прохожий дал еду.'); } else { const cl=['cap','rag','cardboard','boots']; let c=cl[Math.floor(Math.random()*cl.length)]; invAdd(c,1); log(`Прохожий дал ${ITEMS[c].name}.`); } }, 300);
      }
      return;
    }
    if(dist < 400){
      const dir = player.x > npc.x ? 1 : -1;
      if(dist>55) npc.body.setVelocityX(dir*(npc.isBoss?150:100)); else npc.body.setVelocityX(0);
      npc.flipX = dir < 0;
      if(dist<65 && (!npc.lastAttack || time - npc.lastAttack > 1000)){
        npc.lastAttack = time;
        const dmg = npc.isBoss ? 15 : 5;
        state.hp = Math.max(0, state.hp - dmg);
        game.scene.scenes[0].tweens.add({ targets:npc, angle:dir<0?-20:20, yoyo:true, duration:100 });
        AudioSys.play('punch');
        if(Math.random()<0.3){ const ph=['Эй, лох!','Гони бабки!','Ты чё тут?','Вали отсюда!']; log('💢 ' + ph[Math.floor(Math.random()*ph.length)]); }
        if(state.hp<=0) die('Тебя забили гопники.');
      }
    }
  });
  projectiles = projectiles.filter(p=>{
    if(!p.active) return false;
    let hit = false;
    npcs.forEach(npc=>{
      if(!npc.active||hit) return;
      if(Phaser.Math.Distance.Between(p.x,p.y,npc.x,npc.y)<40){
        npc.hp -= p.dmg; hit = true;
        npc.setTint(0xff6666); game.scene.scenes[0].time.delayedCall(150, ()=>{ if(npc.active) npc.clearTint(); });
        spawnHitEffect(p.x,p.y,'glass');
        if(npc.hp<=0){ if(npc.hpBar) npc.hpBar.destroy(); spawnLoot(npc); npc.destroy(); npcs = npcs.filter(n=>n.active); if(npc.isThug && !npc.isBoss){ records.kills++; currentKills++; } if(npc.isBoss) records.bosses++; updateRecords(); }
      }
    });
    if(hit){ p.destroy(); return false; }
    return true;
  });
  updateCtxUI();
  const pcx = Math.floor(player.x / CHUNK_W);
  for(let i = pcx-2; i<=pcx+2; i++) generateChunk(i);
  for(const k of Array.from(loadedChunks.keys())){ if(Math.abs(k-pcx)>3) unloadChunk(k); }
  if(Math.random()<0.0005 && !traderNpc) spawnTrader();
  if(petDogSprite && petDogSprite.active && !isDead){ const targetX = player.x - (player.flipX?-40:40); const dx = targetX - petDogSprite.x; petDogSprite.body.setVelocityX(Math.abs(dx)>20?Math.sign(dx)*220:0); petDogSprite.flipX = dx < 0; }
  state.dogHunger = Math.max(0, state.dogHunger - delta*0.00001);
  if(state.dogHunger<20 && state.petDog && !window._dogHungryWarned){ window._dogHungryWarned = true; log('🐕 Собака голодна!'); }
  if(state.dogHunger>=50) window._dogHungryWarned = false;
  renderHUD();
  if(state.hp<=0) die('Ты не выжил...');
  saveGame();
}
</script>
