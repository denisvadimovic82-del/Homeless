<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>БОМЖ: ONLINE</title>
<style>
  :root { --bg:#0a0a0f; --panel:rgba(15,18,25,0.95); --border:#4a5a7a; --accent:#e8b860; --text:#d0d5e0; --text-dim:#7a859a; --slot-bg:#1a1e28; --slot-border:#3a4a5a; --ui-scale:1;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px); --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  #game { position:absolute; inset:0; z-index:1; }
  #game canvas { display:block; width:100%!important; height:100%!important; }
  #hud { position:absolute; top:calc(var(--safe-top) + 10px); left:calc(var(--safe-left) + 10px); display:flex; flex-direction:column; z-index:10; pointer-events:none; }
  .stat-box { background:var(--panel); border:2px solid var(--border); border-bottom:none; padding:4px 8px; font-size:calc(12px * var(--ui-scale)); font-weight:bold; display:flex; align-items:center; gap:8px; }
  .stat-box:last-child { border-bottom:2px solid var(--border); border-radius:0 0 6px 6px; }
  .stat-box:first-child { border-radius:6px 6px 0 0; }
  .bar-bg { width:70px; height:8px; background:#111; border:1px solid #000; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; transition:width 0.2s; }
  .hp { background:#d34b4b; } .hunger { background:#d39b4b; } .water { background:#4b9bd3; }
  #clock { position:absolute; top:calc(var(--safe-top) + 10px); right:calc(var(--safe-right) + 10px); background:var(--panel); border:2px solid var(--border); border-radius:20px; padding:6px 12px; font-size:calc(12px * var(--ui-scale)); font-weight:bold; color:var(--accent); z-index:10; pointer-events:none; text-align:center; display:flex; flex-direction:column; gap:2px; line-height:1.2; }
  #dayText { font-size:calc(10px * var(--ui-scale)); color:#aaa; font-weight:normal; }
  #weatherText { font-size:calc(11px * var(--ui-scale)); color:#fff; }
  #mpBadge { position:absolute; top:calc(var(--safe-top) + 90px); right:calc(var(--safe-right) + 10px); background:rgba(40,80,40,0.9); border:2px solid #4a8a4a; border-radius:12px; padding:4px 10px; font-size:calc(10px * var(--ui-scale)); color:#c8ffc8; z-index:10; pointer-events:none; }
  #log { position:absolute; bottom:calc(var(--safe-bottom) + 146px); left:0; width:100%; height:50px; background:rgba(10,12,18,0.85); border-top:2px solid var(--border); border-bottom:2px solid var(--border); padding:4px 10px; overflow-y:auto; font-size:calc(11px * var(--ui-scale)); z-index:10; pointer-events:none; color:#fff; text-shadow:1px 1px 0 #000; }
  #log::-webkit-scrollbar { display:none; }
  .tbtn { position:absolute; width:calc(56px * var(--ui-scale)); height:calc(56px * var(--ui-scale)); background:var(--panel); border:2px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:calc(20px * var(--ui-scale)); color:#ccc; z-index:20; transition:transform 0.1s; }
  .tbtn:active { background:rgba(232,184,96,0.2); border-color:var(--accent); color:var(--accent); transform:scale(0.9); }
  #btnLeft { left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 80px); }
  #btnRight{ left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnJump { left:calc(var(--safe-left) + 80px); bottom:calc(var(--safe-bottom) + 47px); }
  #btnAttack{ right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 80px); }
  #btnPick  { right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnCraft { right:calc(var(--safe-right) + 80px); bottom:calc(var(--safe-bottom) + 14px); }
  #btnInv   { right:calc(var(--safe-right) + 80px); bottom:calc(var(--safe-bottom) + 80px); }
  #btnThrow { right:calc(var(--safe-right) + 146px); bottom:calc(var(--safe-bottom) + 47px); background:#3a2a1a; border-color:#8a5a2a; display:none; }
  #btnSit   { right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 146px); background:#4a3a2a; border-color:#8a6a4a; }
  #ctxBtn   { right:calc(var(--safe-right) + 80px); bottom:calc(var(--safe-bottom) + 146px); background:#2a4a2a; border-color:#4a8a4a; display:none; }
  #ctxBtnHide { right:calc(var(--safe-right) + 146px); bottom:calc(var(--safe-bottom) + 146px); background:#2a2a4a; border-color:#4a4a8a; display:none; }
  #btnRecord { left:calc(var(--safe-left) + 14px); bottom:calc(var(--safe-bottom) + 146px); background:#2a3a4a; border-color:#4a5a8a; }
  #deathScreen { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.95); display:none; align-items:center; justify-content:center; flex-direction:column; color:#d34b4b; font-family:monospace; }
  #deathScreen h1 { font-size:40px; margin-bottom:20px; }
  #deathScreen button { background:#333; color:#fff; border:2px solid #666; padding:15px 30px; font-size:18px; border-radius:8px; cursor:pointer; font-weight:bold; }
  #hideOverlay { position:fixed; inset:0; background:#000; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:monospace; font-size:20px; }
  .modal { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .modal-box { background:var(--panel); border:2px solid var(--border); border-radius:10px; width:95%; max-width:420px; padding:16px; display:flex; flex-direction:column; max-height:85vh; overflow:hidden; }
  .modal-box h3 { margin:0 0 12px; color:var(--accent); text-align:center; font-size:18px; text-transform:uppercase; }
  .inv-layout { display:flex; gap:12px; height:100%; max-height:60vh; overflow:hidden; }
  .eq-pane { display:grid; grid-template-columns:1fr; gap:8px; background:#0d1015; padding:10px; border-radius:8px; border:1px solid var(--slot-border); width:64px; align-content:start; flex-shrink:0; }
  .eq-slot { width:44px; height:44px; background:var(--slot-bg); border:2px solid var(--slot-border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; user-select:none; position:relative; }
  .eq-slot.active { border-color:var(--accent); box-shadow:inset 0 0 10px rgba(232,184,96,0.4); }
  .eq-slot .ghost { opacity:0.2; font-size:22px; position:absolute; pointer-events:none; }
  .eq-slot .real { position:relative; z-index:1; }
  .inv-pane { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #invGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; overflow-y:auto; padding-right:4px; align-content:start; max-height:60vh; }
  .slot { width:100%; aspect-ratio:1; background:var(--slot-bg); border:1px solid var(--slot-border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; position:relative; user-select:none; flex-shrink:0; }
  .slot .count { position:absolute; bottom:2px; right:4px; font-size:12px; color:#fff; font-weight:bold; text-shadow:1px 1px 0 #000; }
  .slot.weapon-type { border-color:#5588cc; background:linear-gradient(145deg,#1a1e28,#1a2233); }
  .slot.armor-type { border-color:#cc8855; background:linear-gradient(145deg,#1a1e28,#2a1e18); }
  .slot.mat-type { border-color:#558855; background:linear-gradient(145deg,#1a1e28,#182418); }
  .slot.unique-type { border-color:#c060c0; background:linear-gradient(145deg,#1a1e28,#301830); box-shadow:inset 0 0 8px #602060; }
  .craft-tabs { display:flex; gap:4px; margin-bottom:12px; overflow-x:auto; }
  .craft-tab { background:#1a1e28; border:1px solid var(--slot-border); border-radius:4px; padding:6px 12px; color:var(--text-dim); font-size:12px; font-weight:bold; cursor:pointer; }
  .craft-tab.active { background:#2a3a5a; color:var(--accent); border-color:var(--accent); }
  #craftList { max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .recipe-btn { background:#141820; color:var(--text); border:1px solid var(--slot-border); border-radius:6px; padding:10px; display:flex; justify-content:space-between; align-items:center; font-size:12px; cursor:pointer; }
  .recipe-btn:disabled { opacity:0.3; }
  .recipe-btn .title { font-weight:bold; font-size:13px; color:#fff; }
  .recipe-btn .cost { color:var(--text-dim); font-size:11px; margin-top:4px; }
  .shop-row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding:8px 0; font-size:13px; }
  .shop-row button { padding:6px 12px; background:#4a3a2a; border:1px solid var(--accent); color:#fff; border-radius:4px; cursor:pointer; font-weight:bold; }
  .shop-row button:disabled { opacity:0.4; }
  .record-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333; font-size:14px; }
  .record-val { color:var(--accent); font-weight:bold; }
  .close-btn { margin-top:12px; background:#3a1a1a; border:2px solid #6a2a2a; color:#fff; width:100%; padding:12px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; }
  #tooltip { position:fixed; z-index:11000; display:none; background:rgba(10,12,18,0.98); border:2px solid #4a5a7a; border-radius:8px; padding:10px; max-width:220px; min-width:160px; box-shadow:0 10px 30px rgba(0,0,0,0.9); font-family:monospace; color:#d0d5e0; font-size:12px; pointer-events:none; transform:translate(-50%,-100%); margin-top:-10px; }
  #ttTitle { font-size:13px; font-weight:bold; color:#e8b860; margin-bottom:3px; }
  #ttDesc { color:#8a95aa; font-style:italic; margin-bottom:6px; font-size:11px; line-height:1.2; }
  #ttStats { display:flex; flex-direction:column; gap:2px; font-size:11px; }
  .tt-row { display:flex; justify-content:space-between; gap:8px; }
  .tt-row span:first-child { color:#7a859a; }
  .tt-row span:last-child { color:#e8b860; font-weight:bold; }
  .tt-diff { margin-top:6px; padding-top:6px; border-top:1px solid #333; font-size:11px; }
  .tt-up { color:#6c6; } .tt-down { color:#c66; } .tt-same { color:#aaa; }
</style>
</head>
<body>
<div id="game"></div>
<div id="mpBadge" style="display:none;">👥 <span id="mpCount">0</span></div>
<div id="hideOverlay"><h2>Ты прячешься...</h2></div>
<div id="deathScreen"><h1>ТЫ УМЕР</h1><p id="deathReason" style="color:#aaa;margin-bottom:20px;"></p><button onclick="respawn()">ВСТАТЬ СНОВА</button></div>
<div id="clock"><div>🕒 <span id="timeText">12:00</span></div><div id="dayText">Пн, 1 Янв, 2024</div><div id="weatherText">☀️ Ясно</div></div>
<div id="hud">
  <div class="stat-box">❤️ <div class="bar-bg"><div id="hpbar" class="bar-fill hp" style="width:100%"></div></div></div>
  <div class="stat-box">🍖 <div class="bar-bg"><div id="hungerbar" class="bar-fill hunger" style="width:100%"></div></div></div>
  <div class="stat-box">💧 <div class="bar-bg"><div id="waterbar" class="bar-fill water" style="width:100%"></div></div></div>
</div>
<div id="log"></div>
<div id="btnLeft" class="tbtn">◀</div><div id="btnRight" class="tbtn">▶</div><div id="btnJump" class="tbtn">⤒</div>
<div id="btnAttack" class="tbtn">⚔</div><div id="btnPick" class="tbtn">✋</div><div id="btnCraft" class="tbtn">🔨</div>
<div id="btnInv" class="tbtn">🎒</div><div id="btnThrow" class="tbtn">🍾</div><div id="btnSit" class="tbtn">🪑</div>
<div id="btnRecord" class="tbtn">🏆</div><div id="ctxBtn" class="tbtn">🔍</div><div id="ctxBtnHide" class="tbtn">🛌</div>
<div id="tooltip"><div id="ttTitle"></div><div id="ttDesc"></div><div id="ttStats"></div></div>
<div id="invPanel" class="modal"><div class="modal-box">
  <h3>🎒 Инвентарь</h3>
  <div class="inv-layout">
    <div class="eq-pane">
      <div class="eq-slot" data-slot="head"><span class="ghost">👒</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="body"><span class="ghost">🧥</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="hands"><span class="ghost">🧤</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="legs"><span class="ghost">👖</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="feet"><span class="ghost">👢</span><span class="real"></span></div>
      <div class="eq-slot" data-slot="weapon" style="border-color:#5588cc;"><span class="ghost">⚔</span><span class="real"></span></div>
    </div>
    <div class="inv-pane"><div id="invGrid"></div></div>
  </div>
  <button class="close-btn" id="closeInv">ЗАКРЫТЬ</button>
</div></div>
<div id="craftPanel" class="modal"><div class="modal-box">
  <h3>🔨 Верстак</h3><div class="craft-tabs" id="craftTabs"></div><div id="craftList"></div>
  <button class="close-btn" id="closeCraft">ЗАКРЫТЬ</button>
</div></div>
<div id="shopPanel" class="modal"><div class="modal-box">
  <h3 id="shopTitle">🏪</h3><div id="shopItems" style="overflow-y:auto;max-height:50vh;"></div>
  <button class="close-btn" onclick="document.getElementById('shopPanel').classList.remove('open')">ЗАКРЫТЬ</button>
</div></div>
<div id="recordPanel" class="modal"><div class="modal-box">
  <h3>🏆 Рекорды</h3>
  <div class="record-row"><span>Дней:</span> <span class="record-val" id="recDays">0</span></div>
  <div class="record-row"><span>Монет:</span> <span class="record-val" id="recCoins">0</span></div>
  <div class="record-row"><span>Гопников:</span> <span class="record-val" id="recKills">0</span></div>
  <div class="record-row"><span>Боссов:</span> <span class="record-val" id="recBosses">0</span></div>
  <div class="record-row"><span>Бизнес:</span> <span class="record-val" id="recBiz">0</span></div>
  <button class="close-btn" onclick="document.getElementById('recordPanel').classList.remove('open')">ЗАКРЫТЬ</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
// ============ ПУНКТ 2: PWA ============
(function initPWA() {
  const manifest = {
    name: "БОМЖ: ONLINE", short_name: "Бомж", start_url: ".", display: "standalone",
    background_color: "#0a0a0f", theme_color: "#111111",
    icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🍺</text></svg>", sizes: "192x192", type: "image/svg+xml" }]
  };
  const manifestURL = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  const link = document.createElement('link'); link.rel = 'manifest'; link.href = manifestURL;
  document.head.appendChild(link);

  const swCode = `
    const CACHE = 'bum-v1';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', e => { });
  `;
  const swURL = URL.createObjectURL(new Blob([swCode], { type: "application/javascript" }));
  if ('serviceWorker' in navigator) navigator.serviceWorker.register(swURL).catch(()=>{});
})();

// ============ СОХРАНЕНИЯ ============
const SAVE_KEY = 'bum_save_v2';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      hp: state.hp, hunger: state.hunger, water: state.water,
      equip: state.equip, inv: state.inv,
      businessLevel, worldTime, worldDay, currentYear,
      x: player ? player.x : 0, y: player ? player.y : 0
    }));
  } catch(e) { console.warn('[SAVE] ошибка', e); }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    Object.assign(state, { hp: data.hp ?? 100, hunger: data.hunger ?? 100, water: data.water ?? 100, equip: data.equip || state.equip, inv: data.inv || state.inv });
    businessLevel = data.businessLevel || 0;
    worldTime = data.worldTime ?? 8*60;
    worldDay = data.worldDay || 1;
    currentYear = data.currentYear || 2024;
    window.__savedX = data.x || 0;
    console.log('[SAVE] Загружено, x =', window.__savedX);
    return true;
  } catch(e) { console.warn('[SAVE] ошибка загрузки', e); return false; }
}
setInterval(saveGame, 5000);
window.addEventListener('beforeunload', saveGame);

// ============ МУЛЬТИПЛЕЕР ============
const mp = {
  channel: null, selfId: 'p' + Math.floor(Math.random()*999999),
  players: {},
  init() {
    try {
      this.channel = new BroadcastChannel('bum_online');
      this.channel.onmessage = (e) => this.onMessage(e.data);
      setInterval(() => this.sendPosition(), 100);
      setInterval(() => this.ping(), 2000);
      console.log('[MP] канал открыт, id:', this.selfId);
      document.getElementById('mpBadge').style.display = 'block';
      // Один глобальный listener для лейблов (без утечки)
      const scene = game.scene.scenes[0];
      if (scene) {
        scene.events.on('update', () => {
          for (const id in this.players) {
            const s = this.players[id];
            if (s.active && s.label && s.label.active) {
              s.label.x = s.x;
              s.label.y = s.y - 40;
            }
          }
        });
      }
    } catch(e) { console.warn('[MP] BroadcastChannel недоступен', e); }
  },
  sendPosition() {
    if (!this.channel || !player) return;
    this.channel.postMessage({ type:'pos', id:this.selfId, x:player.x, y:player.y, flip:player.flipX, weapon:state.equip.weapon, armor:state.equip.body });
  },
  ping() { if (this.channel) this.channel.postMessage({ type:'ping', id:this.selfId, t:Date.now() }); },
  onMessage(data) {
    if (data.id === this.selfId) return;
    if (data.type === 'pos') {
      if (!this.players[data.id]) this.spawnRemote(data.id, data.x, data.y);
      const p = this.players[data.id];
      if (p && p.active) { p.x = data.x; p.y = data.y; p.flipX = data.flip; }
      this.updateCount();
    } else if (data.type === 'leave') {
      const p = this.players[data.id];
      if (p) { if(p.label) p.label.destroy(); p.destroy(); delete this.players[data.id]; }
      this.updateCount();
    }
  },
  spawnRemote(id, x, y) {
    const scene = game.scene.scenes[0]; if (!scene) return;
    const s = scene.add.rectangle(x, y, 28, 56, 0x8fa8ff).setDepth(15);
    const label = scene.add.text(x, y-40, '👤', { fontSize:'14px' }).setDepth(16);
    s.label = label;
    this.players[id] = s;
  },
  updateCount() {
    document.getElementById('mpCount').textContent = Object.keys(this.players).length;
  }
};
setTimeout(()=>mp.init(), 500);

// ============ АДАПТИВ ============
function computeUIScale(){ const base = Math.min(window.innerWidth, window.innerHeight)/380; document.documentElement.style.setProperty('--ui-scale', Math.max(0.85, Math.min(1.4, base)).toFixed(3)); }
computeUIScale(); window.addEventListener('resize', computeUIScale);

// ============ ЗВУК ============
const AudioSys = {
  ctx:null, init(){ if(this.ctx) return; this.ctx=new (window.AudioContext||window.webkitAudioContext)(); },
  play(t){ if(!this.ctx) return; const time=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();
    if(t==='punch'){osc.type='sine';osc.frequency.setValueAtTime(100,time);osc.frequency.exponentialRampToValueAtTime(20,time+0.1);gain.gain.setValueAtTime(0.4,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.1);}
    else if(t==='blunt'){osc.type='square';osc.frequency.setValueAtTime(80,time);osc.frequency.exponentialRampToValueAtTime(10,time+0.2);gain.gain.setValueAtTime(0.3,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.2);}
    else if(t==='slash'){osc.type='sawtooth';osc.frequency.setValueAtTime(600,time);osc.frequency.exponentialRampToValueAtTime(200,time+0.1);gain.gain.setValueAtTime(0.1,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.1);}
    else if(t==='glass'){osc.type='triangle';osc.frequency.setValueAtTime(1500,time);osc.frequency.exponentialRampToValueAtTime(500,time+0.15);gain.gain.setValueAtTime(0.2,time);gain.gain.exponentialRampToValueAtTime(0.01,time+0.15);}
    else if(t==='pickup'){osc.type='sine';osc.frequency.setValueAtTime(600,time);osc.frequency.setValueAtTime(800,time+0.1);gain.gain.setValueAtTime(0.15,time);gain.gain.linearRampToValueAtTime(0,time+0.15);}
    else if(t==='coin'){osc.type='triangle';osc.frequency.setValueAtTime(1200,time);osc.frequency.exponentialRampToValueAtTime(1600,time+0.1);gain.gain.setValueAtTime(0.2,time);gain.gain.linearRampToValueAtTime(0,time+0.2);}
    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(time); osc.stop(time+0.25);
  }
};

function preload(){ createTextures(this); }

function create(){
  const W=this.scale.width, H=this.scale.height;
  this.cameras.main.setBackgroundColor(0x5dade2);
  const groundY = H - 20;
  groundBody = this.add.rectangle(-500000, groundY, 1000000, 40, 0x2a3a2a).setOrigin(0,0).setDepth(1);
  this.physics.add.existing(groundBody, true);
  groundBody.body.setSize(1000000, 40);
  groundBody.body.updateFromGameObject();
  this.add.rectangle(-500000, H-10, 1000000, 20, 0x555555).setOrigin(0,0).setDepth(2);

  this.anims.create({ key:'bum_walk_anim', frames:[{key:'bum_walk1'},{key:'bum_walk2'}], frameRate:8, repeat:-1 });
  this.anims.create({ key:'civ_m_walk', frames:[{key:'npc_m1'},{key:'npc_m2'}], frameRate:6, repeat:-1 });
  this.anims.create({ key:'civ_f_walk', frames:[{key:'npc_f1'},{key:'npc_f2'}], frameRate:6, repeat:-1 });

  player = this.physics.add.sprite(0, groundY - 48, 'bum_idle').setDepth(10);
  player.body.setSize(24, 48); player.body.setOffset(4, 8);
  player.setCollideWorldBounds(false);
  this.physics.add.collider(player, groundBody);
  this.cameras.main.startFollow(player, true, 0.1, 0.1);

  weaponSprite = this.add.sprite(player.x, player.y, 'w_bottle').setDepth(11).setVisible(false);
  weatherLayer = this.add.graphics(); weatherLayer.setDepth(50); weatherLayer.setScrollFactor(0);

  lastPhase = getTodPhase();
  const NPC_Y = groundY - 24;
  for (let i = 0; i < 6; i++) {
    const isFemale = i % 2 === 0;
    const tex = isFemale ? 'npc_f' : 'npc_m';
    const npc = this.physics.add.sprite(-150 + i*120, NPC_Y, tex);
    npc.body.setSize(24, 48); npc.body.setOffset(4, 8);
    npc.isThug = false; npc.isNpc = true; npc.hp = 20; npc.maxHp = 20;
    npc.didDrop = false; npc.dir = i%3===0?1:-1; npc.isFemale = isFemale;
    npc.setDepth(15);
    this.physics.add.collider(npc, groundBody);
    npcs.push(npc);
  }
  log('Старт. NPC: ' + npcs.length);

  // ПАТЧ: чанки вокруг сохранённой позиции
  if (window.__savedX !== undefined && window.__savedX !== 0) {
    player.x = window.__savedX;
    const savedChunk = Math.floor(player.x / CHUNK_W);
    for (let i = savedChunk - 2; i <= savedChunk + 2; i++) generateChunk(i);
  } else {
    for (let i = -2; i <= 2; i++) generateChunk(i);
  }
  renderUI();
  saveGame();
}

function generateChunk(idx){
  if(loadedChunks.has(idx)) return;
  const scene = game.scene.scenes[0];
  const startX = idx * CHUNK_W;
  const H = scene.scale.height;
  const groundY = H - 20;
  const NPC_Y = groundY - 24;
  const objs = [];

  for(let i=0; i<2; i++){
    let h = 200 + Math.random()*150, w = 120 + Math.random()*80;
    let x = startX + i*(CHUNK_W/2) + 40;
    objs.push(scene.add.rectangle(x+w/2, groundY, w, h, 0x151820).setOrigin(0.5,1).setDepth(-20));
    objs.push(scene.add.triangle(x+w/2, groundY-h, 0,40, w/2+10,0, w+20,40, 0x0d1015).setOrigin(0.5,1).setDepth(-20));
    for(let wy = groundY-40; wy > groundY-h; wy -= 40){
      for(let wx = x+20; wx < x+w-20; wx += 30){
        let isLit = Math.random() > 0.4;
        let win = scene.add.rectangle(wx, wy, 16, 20, 0x111111).setDepth(-15);
        win.isWindow = true; win.isLit = isLit; win.baseColor = 0x111111; win.litColor = 0xffcc55;
        objs.push(win);
        litWindows.push(win); // ПАТЧ: отдельный массив окон
      }
    }
  }
  if(Math.random() > 0.6){
    let type='shop', r=Math.random();
    if(r>0.5) type = r>0.8 ? 'metal' : (r>0.65 ? 'bottles' : 'trash');
    else if(r<0.2) type = 'business';
    let tex='shop', lbl='🏪 МАГАЗИН', col='#ffcc00';
    if(type==='metal'){tex='recycle_metal';lbl='⚙️ МЕТАЛЛ';col='#aaa';}
    if(type==='bottles'){tex='recycle_bottle';lbl='🍾 БУТЫЛКИ';col='#4a4';}
    if(type==='trash'){tex='recycle_trash';lbl='🗑️ МУСОР';col='#a4a';}
    if(type==='business'){tex='shop';lbl='💼 БИЗНЕС';col='#e8b860';}
    let bx = startX + 100 + Math.random()*200;
    let b = scene.physics.add.sprite(bx, groundY, tex).setOrigin(0.5,1).setDepth(-10);
    b.body.setAllowGravity(false); b.body.setImmovable(true);
    b.isBuilding = true; b.buildType = type;
    let sign = scene.add.text(bx, groundY-90, lbl, {fontSize:'12px', color:col, fontStyle:'bold', backgroundColor:'#111', padding:{x:4,y:2}}).setOrigin(0.5,1).setDepth(-10);
    objs.push(b, sign); buildings.push(b);
  }
  if(Math.random() > 0.2){
    let bagX = startX + 200 + (Math.random()*100 - 50);
    const bag = scene.physics.add.sprite(bagX, groundY, 'trash_bags').setOrigin(0.5,1);
    bag.body.setAllowGravity(false); bag.body.setImmovable(true);
    bag.looted = false; bag.isTrash = true; bag.setDepth(-5);
    trashBags.push(bag); objs.push(bag);
  }
  if (!npcChunks.has(idx)) {
    npcChunks.set(idx, true);
    const phase = getTodPhase();
    if (phase === 'morning' || phase === 'noon' || phase === 'evening') {
      let count = phase === 'morning' ? 2 + Math.floor(Math.random()*3) : (phase === 'noon' ? 1 + Math.floor(Math.random()*2) : (Math.random()<0.7?1:0));
      for(let j=0; j<count; j++){
        const isFemale = Math.random() > 0.5;
        const tex = isFemale ? 'npc_f' : 'npc_m';
        const npc = scene.physics.add.sprite(startX + 50 + Math.random()*(CHUNK_W-100), NPC_Y, tex);
        npc.body.setSize(24, 48); npc.body.setOffset(4, 8);
        npc.isThug = false; npc.isNpc = true; npc.hp = 20; npc.maxHp = 20;
        npc.didDrop = false; npc.dir = Math.random() > 0.5 ? 1 : -1; npc.isFemale = isFemale;
        npc.setDepth(15);
        scene.physics.add.collider(npc, groundBody);
        npcs.push(npc);
      }
      if (Math.random() < 0.3) {
        const dog = scene.physics.add.sprite(startX + 50 + Math.random()*(CHUNK_W-100), NPC_Y - 10, 'npc_dog');
        dog.body.setSize(40, 32);
        dog.isNpc = true; dog.isThug = false; dog.isAnimal = true; dog.hp = 15;
        dog.dir = Math.random() > 0.5 ? 1 : -1;
        dog.setDepth(15);
        scene.physics.add.collider(dog, groundBody);
        npcs.push(dog);
      }
      if (Math.random() < 0.5) {
        const rat = scene.physics.add.sprite(startX + 50 + Math.random()*(CHUNK_W-100), NPC_Y + 10, 'npc_rat');
        rat.body.setSize(24, 16);
        rat.isNpc = true; rat.isThug = false; rat.isAnimal = true; rat.hp = 5;
        rat.dir = Math.random() > 0.5 ? 1 : -1;
        rat.setDepth(15);
        scene.physics.add.collider(rat, groundBody);
        npcs.push(rat);
      }
    } else {
      if (Math.random() < 0.5) {
        const count = 1 + Math.floor(Math.random()*2);
        for(let j=0; j<count; j++){
          const isFemale = Math.random() > 0.5;
          const tex = isFemale ? 'npc_thug_f' : 'npc_thug_m';
          const npc = scene.physics.add.sprite(startX + 50 + Math.random()*(CHUNK_W-100), NPC_Y, tex);
          npc.body.setSize(24, 48); npc.body.setOffset(4, 8);
          npc.isThug = true; npc.isNpc = true; npc.isBoss = false; npc.isFemale = isFemale;
          npc.hp = 30; npc.maxHp = 30; npc.dir = Math.random() > 0.5 ? 1 : -1;
          npc.setDepth(15);
          scene.physics.add.collider(npc, groundBody);
          npcs.push(npc);
        }
      }
      if (Math.random() < 0.05) {
        const bx = startX + 50 + Math.random()*300;
        const npc = scene.physics.add.sprite(bx, NPC_Y - 24, 'npc_boss');
        npc.body.setSize(48, 72); npc.body.setOffset(0, 0);
        npc.isThug = true; npc.isNpc = true; npc.isBoss = true; npc.isFemale = false;
        npc.hp = 150; npc.maxHp = 150;
        npc.setDepth(15);
        scene.physics.add.collider(npc, groundBody);
        npcs.push(npc);
        log('⚠️ Появился БОСС!');
      }
    }
  }
  loadedChunks.set(idx, objs);
}

function unloadChunk(idx){
  if(!loadedChunks.has(idx)) return;
  loadedChunks.get(idx).forEach(o=>{ if(o.active){ if(o.hpBar) o.hpBar.destroy(); o.destroy(); } });
  // ПАТЧ: удаляем NPC этого чанка
  npcs = npcs.filter(n=>{
    if(!n.active) return false;
    if(Math.floor(n.x / CHUNK_W) === idx){
      if(n.hpBar) n.hpBar.destroy();
      n.destroy();
      return false;
    }
    return true;
  });
  trashBags = trashBags.filter(t=>t.active);
  buildings = buildings.filter(b=>b.active);
  loadedChunks.delete(idx);
  npcChunks.delete(idx); // ПАТЧ: позволяем NPC заспавниться снова
}

function updateTimeOfDay(delta){
  worldTime += delta * 0.0017;
  if(worldTime > 24*60){ worldTime = 0; worldDay++; }
  const hours = Math.floor(worldTime/60), mins = Math.floor(worldTime%60);
  const monthIndex = Math.floor((worldDay-1)/30) % 12;
  const dayInMonth = ((worldDay-1)%30) + 1;
  currentYear = 2024 + Math.floor((worldDay-1)/360);
  let season='winter';
  if(monthIndex>=2&&monthIndex<=4) season='spring';
  else if(monthIndex>=5&&monthIndex<=7) season='summer';
  else if(monthIndex>=8&&monthIndex<=10) season='autumn';
  let timeStr='', skyColor=0x5dade2;
  if(hours>=6&&hours<12){ timeStr='Утро'; skyColor=0x87CEEB; }
  else if(hours>=12&&hours<18){ timeStr='День'; skyColor=0x5dade2; }
  else if(hours>=18&&hours<21){ timeStr='Вечер'; skyColor=0xffaa77; }
  else { timeStr='Ночь'; skyColor=0x0a0a1a; }
  if(currentWeather==='rain') skyColor = hours>=6&&hours<21 ? 0x4a6a8a : 0x050510;
  if(currentWeather==='storm') skyColor = hours>=6&&hours<21 ? 0x304050 : 0x020208;
  if(currentWeather==='snow') skyColor = hours>=6&&hours<21 ? 0xaad0e8 : 0x1a1a2a;
  weatherTimer += delta;
  if(weatherTimer>30000){
    weatherTimer = 0;
    let r = Math.random();
    if(season==='spring') currentWeather = r>0.6 ? 'rain' : 'clear';
    else if(season==='summer') currentWeather = r>0.8 ? 'storm' : (r>0.5 ? 'rain' : 'clear');
    else if(season==='autumn') currentWeather = r>0.8 ? 'storm' : (r>0.4 ? 'rain' : 'clear');
    else currentWeather = r>0.7 ? 'snow' : 'clear';
  }
  if(currentWeather==='storm' && Math.random()<0.005) lightningAlpha = 0.8;
  if(lightningAlpha > 0){ lightningAlpha -= delta*0.005; if(lightningAlpha < 0) lightningAlpha = 0; }
  let icon = '☀️'; if(currentWeather==='rain') icon='🌧️'; if(currentWeather==='snow') icon='❄️'; if(currentWeather==='storm') icon='⛈️';
  const dayIndex = (worldDay-1) % 7;
  document.getElementById('timeText').textContent = `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')} (${timeStr})`;
  document.getElementById('dayText').textContent = `${daysOfWeek[dayIndex]}, ${dayInMonth} ${months[monthIndex]} ${currentYear}`;
  document.getElementById('weatherText').textContent = `${icon} ${currentWeather==='clear'?'Ясно':currentWeather==='rain'?'Дождь':currentWeather==='snow'?'Снег':'Гроза'}`;
  const scene = game.scene.scenes[0];
  if(scene && scene.cameras && scene.cameras.main) scene.cameras.main.setBackgroundColor(skyColor);
  // ПАТЧ: только окна из litWindows
  const isNight = (hours>=21 || hours<6);
  for (let i = litWindows.length - 1; i >= 0; i--) {
    const w = litWindows[i];
    if (!w.active) { litWindows.splice(i,1); continue; }
    const target = isNight ? (w.isLit ? w.litColor : w.baseColor) : w.baseColor;
    if (w.fillColor !== target) w.setFillStyle(target);
  }
  const newPhase = getTodPhase();
  if(newPhase !== lastPhase){
    lastPhase = newPhase;
    if(newPhase==='night') log('🌙 Ночь.');
    else if(newPhase==='morning') log('🌅 Утро.');
    else if(newPhase==='noon') log('☀️ День.');
    else if(newPhase==='evening') log('🌇 Вечер.');
  }
}

function updateWeatherParticles(delta){
  if(!weatherLayer) return;
  weatherLayer.clear();
  const W = game.scene.scenes[0].scale.width, H = game.scene.scenes[0].scale.height;
  if(lightningAlpha > 0){ weatherLayer.fillStyle(0xffffff, lightningAlpha); weatherLayer.fillRect(0,0,W,H); }
  if(currentWeather==='rain'||currentWeather==='storm'){ for(let i=0;i<5;i++) if(weatherParticles.length<200) weatherParticles.push({x:Math.random()*W,y:-10,vx:-0.5,vy:10+Math.random()*5,type:'rain',size:1+Math.random()*1.5,life:2000}); }
  else if(currentWeather==='snow'){ for(let i=0;i<3;i++) if(weatherParticles.length<150) weatherParticles.push({x:Math.random()*W,y:-10,vx:(Math.random()-0.5)*0.8,vy:1.5+Math.random()*1.5,type:'snow',size:1.5+Math.random()*2,life:10000,wobble:Math.random()*Math.PI*2}); }
  for(let i=weatherParticles.length-1;i>=0;i--){
    const p = weatherParticles[i];
    p.x += p.vx; p.y += p.vy; p.life -= delta;
    if(p.type==='snow'){ p.wobble += 0.02; p.x += Math.sin(p.wobble)*0.4; }
    if(p.y>H+20||p.life<=0){ weatherParticles.splice(i,1); continue; }
    if(p.type==='rain'){ weatherLayer.fillStyle(0xaaddff,0.7); weatherLayer.fillRect(p.x,p.y,p.size,10); }
    else if(p.type==='snow'){ weatherLayer.fillStyle(0xffffff,0.9); weatherLayer.fillCircle(p.x,p.y,p.size); }
  }
}

function startHide(){
  if(isHiding) return;
  isHiding = true;
  document.getElementById('hideOverlay').style.display='flex';
  worldTime = 6*60;
  worldDay++;
  updateRecords();
  setTimeout(()=>{
    isHiding = false;
    document.getElementById('hideOverlay').style.display='none';
    log('Ночь прошла.');
  }, 3000);
}

const ctxBtn = document.getElementById('ctxBtn'), ctxBtnHide = document.getElementById('ctxBtnHide'), btnSit = document.getElementById('btnSit');

function doPickup(){ game.scene.scenes[0].children.list.forEach(child=>{ if(child.isPickup && Phaser.Math.Distance.Between(player.x,player.y,child.x,child.y)<80){ invAdd(child.itemId,1); log(`Подобрано: ${ITEMS[child.itemId].icon} ${ITEMS[child.itemId].name}`); child.destroy(); } }); }
function interact(){ if(!currentCtxTarget) return; if(currentCtxTarget.isTrash){ if(currentCtxTarget.looted){ log('Уже пусто.'); return; } if(isHiding) return; currentCtxTarget.looted = true; currentCtxTarget.destroy(); const loot=['bottle','bottle','bottle','bottle','bottle','rag','rag','metal','metal','board','nail','tape','coin','coin','water_bottle','food','plastic','glass','wire','rozochka','pipe','shiv','cap','cardboard']; let count=2+Math.floor(Math.random()*4), found=[]; for(let i=0;i<count;i++){ let item=loot[Math.floor(Math.random()*loot.length)]; invAdd(item,1); found.push(`${ITEMS[item].icon}${ITEMS[item].name}`); } log(`Порылся: ${found.join(', ')}`); } else if(currentCtxTarget.isBuilding){ openShop(currentCtxTarget.buildType); } }
function sitDown(){ if(isSitting) return; isSitting=true; btnSit.style.display='none'; player.anims.stop(); player.setTexture('bum_sit'); player.body.setVelocityX(0); const groundY = game.scene.scenes[0].scale.height - 20; player.y = groundY - 24; sittingCan = game.scene.scenes[0].add.sprite(player.x+20, groundY-8, 'can').setDepth(5); log('Сел просить...'); document.getElementById('btnAttack').style.display='none'; }
function standUp(){ if(!isSitting) return; isSitting=false; player.setTexture('bum_idle'); if(sittingCan){ sittingCan.destroy(); sittingCan=null; } document.getElementById('btnAttack').style.display='flex'; log('Встал.'); }
btnSit.onclick = ()=>{ if(isSitting) standUp(); else sitDown(); };

function updateCtxUI(){
  let closest=null, minDist=100;
  trashBags.forEach(bag=>{ if(!bag.active) return; let d=Phaser.Math.Distance.Between(player.x,player.y,bag.x,bag.y); if(d<minDist){ minDist=d; closest={obj:bag,isTrash:true}; } });
  buildings.forEach(b=>{ if(!b.active) return; let d=Phaser.Math.Distance.Between(player.x,player.y,b.x,b.y); if(d<minDist){ minDist=d; closest={obj:b,isBuilding:true}; } });
  currentCtxTarget = closest ? closest.obj : null;
  if(isSitting){ ctxBtn.style.display='none'; ctxBtnHide.style.display='none'; btnSit.style.display='flex'; btnSit.textContent='🚶'; }
  else { btnSit.style.display='flex'; btnSit.textContent='🪑'; if(currentCtxTarget){ ctxBtn.style.display='flex'; if(currentCtxTarget.isTrash){ ctxBtnHide.style.display='flex'; ctxBtn.onclick=interact; ctxBtnHide.onclick=startHide; } else { ctxBtnHide.style.display='none'; ctxBtn.onclick=interact; } } else { ctxBtn.style.display='none'; ctxBtnHide.style.display='none'; } }
}

function doAttack(){
  if(!player || attackCooldown>0 || isDead || isSitting) return;
  attackCooldown = 400;
  game.scene.scenes[0].tweens.add({ targets:player, angle:player.flipX?-15:15, yoyo:true, duration:100 });
  const wep = state.equip.weapon;
  let dmg = 2, effect = 'punch';
  if(wep){ dmg = ITEMS[wep].dmg; effect = ITEMS[wep].effect; }
  AudioSys.play(effect);
  const dir = player.flipX ? -1 : 1;
  if(weaponSprite.visible) game.scene.scenes[0].tweens.add({ targets:weaponSprite, angle:dir*60, yoyo:true, duration:100 });
  npcs.forEach(npc=>{
    if(!npc.active) return;
    const dx = (npc.x - player.x) * dir;
    if(dx>0 && dx<80 && Math.abs(npc.y-player.y)<60){
      npc.hp -= dmg;
      if(npc.isAnimal){
        // ПАТЧ: животное убегает
        npc.dir = npc.x > player.x ? 1 : -1;
      } else if(!npc.isThug){
        npc.isThug=true; npc.setTexture(npc.isFemale?'npc_thug_f':'npc_thug_m'); log('Прохожий в ярости!');
      }
      spawnHitEffect(player.x+dir*30, player.y-10, effect);
      npc.setTint(0xff6666);
      game.scene.scenes[0].time.delayedCall(150, ()=>{ if(npc.active) npc.clearTint(); });
      if(npc.hp<=0){ if(npc.hpBar) npc.hpBar.destroy(); spawnLoot(npc); npc.destroy(); npcs = npcs.filter(n=>n.active); if(npc.isThug) records.kills++; if(npc.isBoss) records.bosses++; updateRecords(); }
    }
  });
}

function spawnLoot(npc){
  const scene = game.scene.scenes[0];
  let drops = [];
  if(npc.isBoss){
    drops = ['crowbar','leather_jacket','coin','coin','armor_plate','katana'];
    Object.keys(bossLootCache).forEach(item=>{
      drops.push(...Array(bossLootCache[item]).fill(item));
    });
    bossLootCache = {};
  }
  else if(npc.isThug) drops = ['pipe','shiv','cap','cardboard','rag','metal','coin','bottle','beer','hammer'];
  else if(npc.isAnimal) drops = ['food','coin'];
  else drops = ['food','water_bottle','coin','rag','cap','boots','jeans','plastic','glass'];

  const seen = new Set();
  const uniq = drops.filter(d => { if(seen.has(d)) return Math.random()>0.4; seen.add(d); return true; });
  const final = uniq.slice(0, 6);
  final.forEach(drop => {
    const s = scene.add.sprite(npc.x+(Math.random()*40-20), npc.y-20, 'item_coin').setScale(1.5);
    s.itemId = drop; s.isPickup = true;
    if(drop==='food') s.setTexture('item_food');
    else if(drop==='water_bottle') s.setTexture('item_water');
    else if(drop==='rag') s.setTexture('item_rag_mat');
    else if(drop==='rozochka') s.setTexture('item_rozochka');
    else if(drop==='bottle') s.setTexture('item_bottle');
    scene.tweens.add({ targets:s, y:s.y-8, yoyo:true, repeat:-1, duration:1000 });
  });
}

function doThrow(){
  if(!player || throwCooldown>0 || isDead || isSitting) return;
  let wep=null;
  if(invCount('bottle')>0) wep='bottle'; else if(invCount('rozochka')>0) wep='rozochka';
  if(!wep) return;
  throwCooldown = 800; invRemove(wep,1);
  const dir = player.flipX ? -1 : 1;
  let proj = game.scene.scenes[0].add.circle(player.x+dir*20, player.y-10, 5, wep==='bottle'?0x44aa44:0xaa4444);
  proj.dmg = ITEMS[wep].dmg; proj.wepType = wep;
  game.scene.scenes[0].physics.add.existing(proj);
  proj.body.setVelocity(dir*600, -200); proj.body.setGravityY(500);
  projectiles.push(proj);
  log(`Брошена ${ITEMS[wep].name}!`);
}

function spawnHitEffect(x,y,type){
  const scene = game.scene.scenes[0];
  if(type==='slash'){ let t=scene.add.text(x,y,'///',{fontSize:'24px',color:'#fff'}).setOrigin(0.5); scene.tweens.add({targets:t,alpha:0,scaleX:2,duration:200,onComplete:()=>t.destroy()}); }
  else if(type==='blunt'){ let t=scene.add.text(x,y,'✦',{fontSize:'30px',color:'#ffaa00'}).setOrigin(0.5); scene.tweens.add({targets:t,alpha:0,scale:2,duration:250,onComplete:()=>t.destroy()}); scene.cameras.main.shake(50,0.01); }
  else if(type==='glass'){ for(let i=0;i<4;i++){ let shard=scene.add.circle(x,y,3,0x88ee88); scene.tweens.add({targets:shard,x:x+(Math.random()*40-20),y:y+(Math.random()*40-20),alpha:0,duration:300,onComplete:()=>shard.destroy()}); } }
  else if(type==='punch'){ let t=scene.add.circle(x,y,10,0xffffff); scene.tweens.add({targets:t,alpha:0,scale:2,duration:150,onComplete:()=>t.destroy()}); }
}

function update(time, delta){
  if(!player || !player.body || isDead || isHiding){ if(weatherLayer) updateWeatherParticles(delta); return; }
  updateTimeOfDay(delta);
  updateWeatherParticles(delta);
  if(businessLevel>0){
    businessTimer += delta;
    if(businessTimer>=5000){
      businessTimer=0;
      state.inv['coin']=(state.inv['coin']||0)+businessLevel;
      renderHUD();
      if(document.getElementById('invPanel').classList.contains('open')) renderInventory();
      log(`Бизнес принес ${businessLevel} 🪙`);
    }
  }
  state.hunger = Math.max(0, state.hunger - delta*0.00005);
  state.water = Math.max(0, state.water - delta*0.00007);
  if(state.hunger<=0 || state.water<=0){ state.hp -= delta*0.005; if(state.hp<=0) die('Ты умер от истощения...'); }
  const speed = 200;
  if(!isSitting){
    player.body.setVelocityX(0);
    if(held.left){ player.body.setVelocityX(-speed); player.flipX=true; player.anims.play('bum_walk_anim',true); }
    else if(held.right){ player.body.setVelocityX(speed); player.flipX=false; player.anims.play('bum_walk_anim',true); }
    else { player.anims.stop(); player.setTexture('bum_idle'); }
    const onGround = player.body.blocked.down || player.body.touching.down;
    if(held.jump && onGround){ player.body.setVelocityY(-600); held.jump=false; }
  }
  if(state.equip.weapon && weaponSprite && !isSitting){
    weaponSprite.setVisible(true);
    const tex = weaponTexture(state.equip.weapon);
    if(weaponSprite.texture.key !== tex) weaponSprite.setTexture(tex);
    const dir = player.flipX ? -1 : 1;
    weaponSprite.x = player.x + dir*18;
    weaponSprite.y = player.y - 10;
    weaponSprite.flipX = player.flipX;
  } else if(weaponSprite) weaponSprite.setVisible(false);
  if(attackCooldown>0) attackCooldown-=delta;
  if(throwCooldown>0) throwCooldown-=delta;
  npcs.forEach(npc=>{
    if(!npc.active) return;
    if(npc.hp < npc.maxHp){ if(!npc.hpBar) npc.hpBar = game.scene.scenes[0].add.rectangle(npc.x,npc.y-40,30,4,0xd34b4b).setDepth(16); npc.hpBar.x=npc.x-15; npc.hpBar.y=npc.y-40; npc.hpBar.width=30*(npc.hp/npc.maxHp); }
    const dist = Phaser.Math.Distance.Between(player.x, player.y, npc.x, npc.y);
    if(!npc.isThug){
      npc.body.setVelocityX(npc.dir * (npc.isAnimal ? 60 : 40));
      npc.flipX = npc.dir < 0;
      if(npc.isAnimal) { }
      else if(npc.body.blocked.down) npc.anims.play(npc.isFemale?'civ_f_walk':'civ_m_walk', true);
      if(isSitting && !npc.didDrop && dist<60 && !npc.isAnimal){
        npc.didDrop = true;
        setTimeout(()=>{
          const r = Math.random();
          if(r<0.4){ invAdd('coin',1+Math.floor(Math.random()*3)); log('Прохожий бросил монетку.'); }
          else if(r<0.8){ invAdd('food',1); log('Прохожий дал еду.'); }
          else { const cl=['cap','rag','cardboard','boots']; let c=cl[Math.floor(Math.random()*cl.length)]; invAdd(c,1); log(`Прохожий дал ${ITEMS[c].name}.`); }
        }, 300);
      }
      return;
    }
    if(dist < 400){
      const dir = player.x > npc.x ? 1 : -1;
      if(dist>55) npc.body.setVelocityX(dir*(npc.isBoss?150:100));
      else npc.body.setVelocityX(0);
      npc.flipX = dir < 0;
      if(dist<65 && (!npc.lastAttack || time - npc.lastAttack > 1000)){
        npc.lastAttack = time;
        const dmg = npc.isBoss ? 15 : 5;
        state.hp -= dmg;
        game.scene.scenes[0].tweens.add({ targets:npc, angle:dir<0?-20:20, yoyo:true, duration:100 });
        AudioSys.play('punch');
        if(Math.random()<0.3){ const ph=['Эй, лох!','Гони бабки!','Ты чё тут забыл?','А ну стоять!','Пиздюлей захотел?']; log(`Гопник: «${ph[Math.floor(Math.random()*ph.length)]}»`); }
        if(npc.isBoss){ Object.keys(state.inv).forEach(k=>{ if(k!=='coin'){ bossLootCache[k]=(bossLootCache[k]||0)+state.inv[k]; } }); state.inv={ coin: state.inv.coin }; log('Босс отобрал вещи!'); renderUI(); }
        player.setTint(0xff0000);
        game.scene.scenes[0].time.delayedCall(200, ()=>player.clearTint());
      }
    }
  });
  // ПАТЧ: безопасная итерация по снарядам
  for(let pi = projectiles.length - 1; pi >= 0; pi--){
    const p = projectiles[pi];
    if(!p.active){ projectiles.splice(pi,1); continue; }
    if(p.y > game.scene.scenes[0].scale.height || p.x < player.x-500 || p.x > player.x+500){
      p.destroy(); projectiles.splice(pi,1); continue;
    }
    let hit = false;
    for(const npc of npcs){
      if(npc.active && Phaser.Math.Distance.Between(p.x,p.y,npc.x,npc.y)<40){
        npc.hp -= p.dmg;
        spawnHitEffect(p.x, p.y, 'glass');
        AudioSys.play('glass');
        if(p.wepType==='rozochka' && Math.random()>0.5){
          let drop=game.scene.scenes[0].add.sprite(p.x,p.y,'item_rozochka').setScale(1.5);
          drop.itemId='rozochka'; drop.isPickup=true;
          game.scene.scenes[0].tweens.add({targets:drop,y:drop.y-8,yoyo:true,repeat:-1,duration:1000});
        }
        p.destroy(); projectiles.splice(pi,1);
        if(npc.hp<=0){ if(npc.hpBar) npc.hpBar.destroy(); spawnLoot(npc); npc.destroy(); npcs = npcs.filter(n=>n.active); if(npc.isThug) records.kills++; if(npc.isBoss) records.bosses++; updateRecords(); }
        hit = true;
        break;
      }
    }
    if(hit) continue;
  }
  const currentChunk = Math.floor(player.x / CHUNK_W);
  for(let i=currentChunk-2; i<=currentChunk+2; i++) if(!loadedChunks.has(i)) generateChunk(i);
  for(const [key] of loadedChunks) if(Math.abs(key-currentChunk) > 4) unloadChunk(key);
  if(!update._ctxT) update._ctxT = 0;
  update._ctxT += delta;
  if(update._ctxT > 100){ update._ctxT = 0; updateCtxUI(); }
  if(!update._t) update._t = 0;
  update._t += delta;
  if(update._t > 200){
    update._t = 0;
    renderHUD();
    if(document.getElementById('invPanel').classList.contains('open')) renderInventory();
    if(document.getElementById('craftPanel').classList.contains('open')) renderCraft();
    saveGame();
  }
}
</script>
